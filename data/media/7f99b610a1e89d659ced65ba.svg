<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ecbf0"/>
      <stop offset="100%" stop-color="#d9f1fb"/>
    </linearGradient>
    <pattern id="dashes" width="60" height="10" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="30" height="8" fill="#f5f5f5"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="-60 0" dur="1s" repeatCount="indefinite"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="url(#sky)"/>
  <circle cx="800" cy="80" r="45" fill="#fff6d0"/>

  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="90" rx="45" ry="18"/>
    <ellipse cx="190" cy="80" rx="35" ry="15"/>
    <ellipse cx="600" cy="130" rx="40" ry="16"/>
    <ellipse cx="640" cy="120" rx="28" ry="12"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="14s" repeatCount="indefinite"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="1050" cy="90" rx="45" ry="18"/>
    <ellipse cx="1090" cy="80" rx="35" ry="15"/>
    <ellipse cx="1500" cy="130" rx="40" ry="16"/>
    <ellipse cx="1540" cy="120" rx="28" ry="12"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="14s" repeatCount="indefinite"/>
  </g>

  <rect x="0" y="450" width="900" height="50" fill="#7bc96f"/>
  <rect x="0" y="415" width="900" height="35" fill="#555b62"/>
  <rect x="0" y="428" width="900" height="10" fill="url(#dashes)"/>

  <g id="bicycle">
    <g id="rearWheel">
      <circle cx="320" cy="385" r="55" fill="none" stroke="#2b2b2b" stroke-width="7"/>
      <circle cx="320" cy="385" r="8" fill="#2b2b2b"/>
      <g stroke="#2b2b2b" stroke-width="3">
        <line x1="320" y1="385" x2="320" y2="332"/>
        <line x1="320" y1="385" x2="320" y2="438"/>
        <line x1="320" y1="385" x2="273" y2="385"/>
        <line x1="320" y1="385" x2="367" y2="385"/>
        <line x1="320" y1="385" x2="284" y2="349"/>
        <line x1="320" y1="385" x2="356" y2="421"/>
        <line x1="320" y1="385" x2="284" y2="421"/>
        <line x1="320" y1="385" x2="356" y2="349"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 320 385" to="360 320 385" dur="1s" repeatCount="indefinite"/>
    </g>

    <g id="frontWheel">
      <circle cx="560" cy="385" r="55" fill="none" stroke="#2b2b2b" stroke-width="7"/>
      <circle cx="560" cy="385" r="8" fill="#2b2b2b"/>
      <g stroke="#2b2b2b" stroke-width="3">
        <line x1="560" y1="385" x2="560" y2="332"/>
        <line x1="560" y1="385" x2="560" y2="438"/>
        <line x1="560" y1="385" x2="513" y2="385"/>
        <line x1="560" y1="385" x2="607" y2="385"/>
        <line x1="560" y1="385" x2="524" y2="349"/>
        <line x1="560" y1="385" x2="596" y2="421"/>
        <line x1="560" y1="385" x2="524" y2="421"/>
        <line x1="560" y1="385" x2="596" y2="349"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 560 385" to="360 560 385" dur="1s" repeatCount="indefinite"/>
    </g>

    <g stroke="#c0392b" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="320" y1="385" x2="440" y2="375"/>
      <line x1="440" y1="375" x2="390" y2="300"/>
      <line x1="320" y1="385" x2="390" y2="300"/>
      <line x1="390" y1="300" x2="520" y2="290"/>
      <line x1="440" y1="375" x2="520" y2="290"/>
      <line x1="520" y1="290" x2="560" y2="385"/>
      <line x1="520" y1="290" x2="520" y2="258"/>
    </g>
    <line x1="500" y1="257" x2="555" y2="253" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>
    <path d="M 390 300 q -6 -10 12 -14 q 22 -4 20 8 q -2 10 -18 10 z" fill="#3a3a3a"/>

    <g id="crank">
      <circle cx="440" cy="375" r="20" fill="none" stroke="#2b2b2b" stroke-width="5"/>
      <g stroke="#2b2b2b" stroke-width="6" stroke-linecap="round">
        <line x1="440" y1="375" x2="405" y2="375"/>
        <line x1="440" y1="375" x2="475" y2="375"/>
      </g>
      <rect x="396" y="371" width="16" height="8" fill="#2b2b2b"/>
      <rect x="468" y="371" width="16" height="8" fill="#2b2b2b"/>
      <animateTransform attributeName="transform" type="rotate" from="0 440 375" to="360 440 375" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>

  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0; 0 3; 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="0.5s" repeatCount="indefinite"/>

    <line x1="368" y1="288" x2="415" y2="358" stroke="#e08b2a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 405 356 q 20 -6 26 4 q -10 8 -26 4 z" fill="#e08b2a"/>
    <line x1="388" y1="290" x2="450" y2="360" stroke="#e08b2a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 440 358 q 20 -6 26 4 q -10 8 -26 4 z" fill="#e08b2a"/>

    <path d="M 320 260 q -25 -5 -18 -22 q 15 -8 28 10 z" fill="#dcd7c9" stroke="#8d8877" stroke-width="2"/>

    <ellipse cx="385" cy="248" rx="68" ry="44" fill="#eae6da" stroke="#8d8877" stroke-width="3"/>

    <g>
      <path d="M 385 210 q 40 -30 78 -18 q 34 10 22 44 q -12 26 -46 24 q -40 -2 -54 -30 z" fill="#eae6da" stroke="#8d8877" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" values="0 385 240; -10 385 240; 0 385 240" keyTimes="0;0.5;1" dur="0.6s" repeatCount="indefinite"/>
    </g>

    <g>
      <ellipse cx="472" cy="192" rx="30" ry="28" fill="#eae6da" stroke="#8d8877" stroke-width="3"/>
      <circle cx="483" cy="184" r="4.5" fill="#2b2b2b"/>
      <path d="M 495 190 Q 590 195 605 222 Q 585 232 555 226 Q 585 200 495 205 Z" fill="#e2a33e" stroke="#a9701e" stroke-width="2"/>
      <path d="M 500 205 Q 575 205 595 224 Q 560 234 520 222 Z" fill="#f0b94f"/>
      <animateTransform attributeName="transform" type="rotate" values="0 385 248; 4 385 248; 0 385 248" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>