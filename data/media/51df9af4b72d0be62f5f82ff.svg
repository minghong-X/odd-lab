<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
<title id="t">骑摩托车的鳄鱼</title>
<desc id="d">一只戴墨镜的鳄鱼骑着红色摩托车在沙漠公路上飞驰，车轮飞转，尾巴摆动，排气管冒烟。</desc>

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b3f6e"/>
    <stop offset="0.45" stop-color="#5d8fc4"/>
    <stop offset="0.8" stop-color="#f2b06a"/>
    <stop offset="1" stop-color="#f6d3a0"/>
  </linearGradient>
  <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fff6cf" stop-opacity="0.95"/>
    <stop offset="0.45" stop-color="#ffd27a" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a4a55"/>
    <stop offset="1" stop-color="#2a2a33"/>
  </linearGradient>
  <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f0685a"/>
    <stop offset="1" stop-color="#b3271d"/>
  </linearGradient>
  <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6cc36f"/>
    <stop offset="1" stop-color="#2e7d32"/>
  </linearGradient>
  <linearGradient id="headG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7ccb7f"/>
    <stop offset="1" stop-color="#3c9440"/>
  </linearGradient>
  <radialGradient id="lampG" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fffbe0"/>
    <stop offset="0.6" stop-color="#ffe066"/>
    <stop offset="1" stop-color="#f0a52a"/>
  </radialGradient>

  <g id="hills">
    <path d="M0,322 L0,250 C60,232 110,262 165,246 C215,232 250,196 300,206 C350,216 372,262 420,252 C470,242 500,214 552,226 C606,238 640,272 700,258 C744,248 776,262 800,254 L800,322 Z" fill="#7a4a63" opacity="0.75"/>
    <path d="M0,322 L0,288 C50,276 96,296 150,286 C205,276 244,258 296,268 C348,278 384,300 436,290 C492,280 520,262 574,274 C630,286 664,304 720,294 C760,287 782,296 800,292 L800,322 Z" fill="#93566c" opacity="0.85"/>
  </g>

  <g id="props">
    <g fill="#2f5d3a">
      <path d="M96,322 L96,282 C96,275 106,275 106,282 L106,322 Z"/>
      <path d="M96,300 C82,300 80,288 80,280 C80,274 88,274 88,281 C88,288 90,292 96,292 Z"/>
      <path d="M106,304 C120,304 122,290 122,282 C122,276 114,276 114,283 C114,292 112,296 106,296 Z"/>
    </g>
    <ellipse cx="300" cy="320" rx="26" ry="7" fill="#6b4256" opacity="0.6"/>
    <path d="M286,321 C290,306 302,302 310,310 C316,316 316,321 316,321 Z" fill="#5c4a52"/>
    <g fill="#2f5d3a">
      <path d="M560,322 L560,270 C560,262 571,262 571,270 L571,322 Z"/>
      <path d="M560,296 C544,296 542,282 542,272 C542,265 551,265 551,273 C551,282 553,287 560,287 Z"/>
      <path d="M571,306 C587,306 589,292 589,282 C589,275 580,275 580,283 C580,292 578,297 571,297 Z"/>
    </g>
    <ellipse cx="700" cy="318" rx="18" ry="5" fill="#6b4256" opacity="0.6"/>
    <path d="M690,319 C693,310 700,308 705,313 C708,316 709,319 709,319 Z" fill="#5c4a52"/>
  </g>

  <g id="cloud" fill="#ffffff" opacity="0.5">
    <ellipse cx="0" cy="0" rx="34" ry="12"/>
    <ellipse cx="-18" cy="4" rx="22" ry="9"/>
    <ellipse cx="16" cy="5" rx="24" ry="9"/>
    <ellipse cx="2" cy="-8" rx="18" ry="10"/>
  </g>
</defs>

<!-- sky -->
<rect width="800" height="400" fill="url(#sky)"/>
<circle cx="662" cy="96" r="120" fill="url(#sunGlow)"/>
<circle cx="662" cy="96" r="40" fill="#ffe9a8"/>

<!-- clouds -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0,0;-900,0" dur="26s" repeatCount="indefinite"/>
  <use href="#cloud" x="140" y="76"/>
  <use href="#cloud" x="430" y="120" transform="scale(0.8)"/>
  <use href="#cloud" x="760" y="60"/>
  <use href="#cloud" x="1040" y="100"/>
  <use href="#cloud" x="1330" y="70" transform="scale(0.9)"/>
  <use href="#cloud" x="1660" y="118"/>
</g>

<!-- hills -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0,0;-800,0" dur="9s" repeatCount="indefinite"/>
  <use href="#hills" x="0"/>
  <use href="#hills" x="800"/>
</g>

<!-- desert floor + road -->
<rect x="0" y="316" width="800" height="18" fill="#c98f5f"/>
<rect x="0" y="328" width="800" height="72" fill="url(#road)"/>
<rect x="0" y="328" width="800" height="4" fill="#8b8b98" opacity="0.7"/>

<!-- roadside props -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0,0;-800,0" dur="2.6s" repeatCount="indefinite"/>
  <use href="#props" x="0"/>
  <use href="#props" x="800"/>
</g>

<!-- road dashes -->
<g fill="#f5e6a8" opacity="0.9">
  <animateTransform attributeName="transform" type="translate" values="0,0;-140,0" dur="0.32s" repeatCount="indefinite"/>
  <rect x="-140" y="360" width="72" height="9" rx="4"/>
  <rect x="0" y="360" width="72" height="9" rx="4"/>
  <rect x="140" y="360" width="72" height="9" rx="4"/>
  <rect x="280" y="360" width="72" height="9" rx="4"/>
  <rect x="420" y="360" width="72" height="9" rx="4"/>
  <rect x="560" y="360" width="72" height="9" rx="4"/>
  <rect x="700" y="360" width="72" height="9" rx="4"/>
  <rect x="840" y="360" width="72" height="9" rx="4"/>
</g>

<!-- speed lines -->
<g stroke="#ffffff" stroke-linecap="round" opacity="0.55">
  <g stroke-width="4">
    <animateTransform attributeName="transform" type="translate" values="820,0;-320,0" dur="0.55s" repeatCount="indefinite"/>
    <line x1="0" y1="196" x2="70" y2="196"/>
  </g>
  <g stroke-width="3">
    <animateTransform attributeName="transform" type="translate" values="820,0;-320,0" dur="0.48s" begin="-0.2s" repeatCount="indefinite"/>
    <line x1="0" y1="232" x2="110" y2="232"/>
  </g>
  <g stroke-width="5">
    <animateTransform attributeName="transform" type="translate" values="820,0;-320,0" dur="0.6s" begin="-0.35s" repeatCount="indefinite"/>
    <line x1="0" y1="268" x2="86" y2="268"/>
  </g>
  <g stroke-width="3">
    <animateTransform attributeName="transform" type="translate" values="820,0;-320,0" dur="0.44s" begin="-0.1s" repeatCount="indefinite"/>
    <line x1="0" y1="150" x2="60" y2="150"/>
  </g>
</g>

<!-- shadow -->
<ellipse cx="418" cy="330" rx="130" ry="12" fill="#000000" opacity="0.28">
  <animate attributeName="rx" values="130;120;130" dur="0.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.28;0.2;0.28" dur="0.5s" repeatCount="indefinite"/>
</ellipse>

<!-- ============ RIG: motorcycle + crocodile ============ -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,1;0,0" dur="0.5s" repeatCount="indefinite"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1.6 415 260;0.8 415 260;-1.6 415 260" dur="1.1s" repeatCount="indefinite"/>

    <!-- exhaust -->
    <path d="M392,282 C364,290 342,288 322,280" fill="none" stroke="#b9c2cc" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="316" cy="278" rx="12" ry="8" fill="#cfd6dd" stroke="#8e98a4" stroke-width="2"/>

    <!-- rear fender / tail -->
    <path d="M300,262 C312,232 350,222 372,232 L366,244 C348,238 320,248 312,268 Z" fill="#b3271d"/>

    <!-- swingarm + frame -->
    <path d="M330,285 L388,268" fill="none" stroke="#2b2b33" stroke-width="10" stroke-linecap="round"/>
    <path d="M388,268 L402,236 L442,230" fill="none" stroke="#2b2b33" stroke-width="9" stroke-linecap="round"/>
    <path d="M402,236 L414,266" fill="none" stroke="#2b2b33" stroke-width="8" stroke-linecap="round"/>
    <path d="M388,268 L372,246" fill="none" stroke="#3a3a44" stroke-width="7" stroke-linecap="round"/>

    <!-- engine -->
    <rect x="384" y="252" width="48" height="32" rx="7" fill="#3d3d47"/>
    <g stroke="#8e98a4" stroke-width="3">
      <line x1="390" y1="256" x2="390" y2="280"/>
      <line x1="398" y1="256" x2="398" y2="280"/>
      <line x1="406" y1="256" x2="406" y2="280"/>
      <line x1="414" y1="256" x2="414" y2="280"/>
    </g>

    <!-- fuel tank -->
    <path d="M398,240 C406,222 428,216 446,224 L450,242 C432,252 406,252 398,240 Z" fill="url(#tank)"/>
    <path d="M406,232 C414,225 428,223 438,227" fill="none" stroke="#ffd0c8" stroke-width="3" opacity="0.7" stroke-linecap="round"/>

    <!-- seat -->
    <path d="M356,236 C356,224 376,218 400,224 L400,238 C382,242 360,242 356,236 Z" fill="#241f22"/>

    <!-- front fork + handlebar -->
    <path d="M500,285 L520,214" fill="none" stroke="#cfd6dd" stroke-width="8" stroke-linecap="round"/>
    <path d="M500,285 L508,218" fill="none" stroke="#9aa4b0" stroke-width="6" stroke-linecap="round"/>
    <path d="M512,214 L500,200" fill="none" stroke="#2b2b33" stroke-width="7" stroke-linecap="round"/>
    <circle cx="498" cy="198" r="6" fill="#241f22"/>

    <!-- front fender -->
    <path d="M470,246 C480,224 512,220 528,236 L520,244 C508,234 486,236 478,252 Z" fill="#b3271d"/>

    <!-- headlight -->
    <circle cx="528" cy="222" r="12" fill="url(#lampG)" stroke="#cfd6dd" stroke-width="3"/>
    <path d="M540,214 L690,178 L700,246 L540,232 Z" fill="#fff3b0" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.05;0.16" dur="1.4s" repeatCount="indefinite"/>
    </path>

    <!-- rear wheel -->
    <g transform="translate(330,285)">
      <circle r="40" fill="none" stroke="#1f1f26" stroke-width="13"/>
      <circle r="33" fill="#3b3b45"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.3s" repeatCount="indefinite"/>
        <g stroke="#cfd6dd" stroke-width="3">
          <line x1="0" y1="-30" x2="0" y2="30"/>
          <line x1="-21" y1="-21" x2="21" y2="21"/>
          <line x1="-30" y1="0" x2="30" y2="0"/>
          <line x1="-21" y1="21" x2="21" y2="-21"/>
        </g>
        <circle cx="0" cy="-24" r="4" fill="#ffd166"/>
      </g>
      <circle r="7" fill="#8e98a4"/>
    </g>

    <!-- front wheel -->
    <g transform="translate(500,285)">
      <circle r="40" fill="none" stroke="#1f1f26" stroke-width="13"/>
      <circle r="33" fill="#3b3b45"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.3s" repeatCount="indefinite"/>
        <g stroke="#cfd6dd" stroke-width="3">
          <line x1="0" y1="-30" x2="0" y2="30"/>
          <line x1="-21" y1="-21" x2="21" y2="21"/>
          <line x1="-30" y1="0" x2="30" y2="0"/>
          <line x1="-21" y1="21" x2="21" y2="-21"/>
        </g>
        <circle cx="0" cy="-24" r="4" fill="#ffd166"/>
      </g>
      <circle r="7" fill="#8e98a4"/>
    </g>

    <!-- crocodile rider -->
    <!-- tail -->
    <path fill="#3c9440" d="M352,220 C310,226 275,214 244,190 C272,224 306,246 356,250 Z">
      <animate attributeName="d" dur="0.44s" repeatCount="indefinite"
        values="M352,220 C310,226 275,214 244,190 C272,224 306,246 356,250 Z;
                M352,220 C310,212 274,222 240,248 C274,246 306,250 356,250 Z;
                M352,220 C310,226 275,214 244,190 C272,224 306,246 356,250 Z"/>
    </path>
    <!-- back leg -->
    <path d="M378,248 L392,274 L382,290" fill="none" stroke="#3c9440" stroke-width="16" stroke-linecap="round"/>

    <!-- torso -->
    <path d="M352,244 C350,214 366,192 396,188 C424,184 448,196 452,216 C456,238 430,254 400,254 C374,254 354,254 352,244 Z" fill="url(#bodyG)"/>
    <path d="M366,246 C384,256 420,254 442,240 C438,252 416,258 396,258 C380,258 370,254 366,246 Z" fill="#a5d6a7" opacity="0.85"/>

    <!-- dorsal scutes -->
    <g fill="#256b29">
      <path d="M366,198 L372,182 L380,196 Z"/>
      <path d="M384,190 L392,174 L399,189 Z"/>
      <path d="M403,187 L412,172 L418,188 Z"/>
      <path d="M422,189 L432,176 L436,191 Z"/>
      <path d="M440,196 L450,186 L452,200 Z"/>
    </g>

    <!-- front leg on grip -->
    <path d="M444,216 L474,226 L508,206" fill="none" stroke="#4caf50" stroke-width="14" stroke-linecap="round"/>
    <circle cx="510" cy="204" r="9" fill="#57bb5b" stroke="#2e7d32" stroke-width="2"/>

    <!-- head + jaws -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 440 194;-2 440 194;0 440 194" dur="0.5s" repeatCount="indefinite"/>
      <!-- lower jaw -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 462 200;0 462 200;7 462 200;0 462 200;0 462 200" dur="3s" repeatCount="indefinite"/>
        <path d="M460,198 C486,204 512,202 530,196 L530,206 C510,214 482,212 461,207 Z" fill="#347f38"/>
        <g fill="#ffffff">
          <path d="M478,203 L484,203 L481,196 Z"/>
          <path d="M494,205 L500,205 L497,198 Z"/>
          <path d="M510,204 L516,204 L513,197 Z"/>
        </g>
      </g>
      <!-- upper head -->
      <path d="M434,192 C444,178 462,170 482,170 C504,170 522,175 532,182 L532,194 C514,199 486,202 462,200 C446,199 436,197 434,192 Z" fill="url(#headG)"/>
      <g fill="#ffffff">
        <path d="M470,196 L478,196 L474,204 Z"/>
        <path d="M486,198 L494,198 L490,206 Z"/>
        <path d="M502,198 L510,198 L506,206 Z"/>
        <path d="M518,197 L526,197 L522,204 Z"/>
      </g>
      <!-- nostril -->
      <ellipse cx="524" cy="180" rx="4" ry="3" fill="#1f5c23"/>
      <!-- brow ridge -->
      <path d="M444,180 C452,172 466,168 478,169" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round"/>
      <!-- sunglasses -->
      <path d="M440,178 L430,182" stroke="#15151b" stroke-width="4" stroke-linecap="round" fill="none"/>
      <ellipse cx="458" cy="182" rx="14" ry="10" fill="#15151b" transform="rotate(-8 458 182)"/>
      <path d="M450,178 L458,174" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85">
        <animate attributeName="opacity" values="0.15;0.95;0.15;0.15;0.15" dur="2.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</g>

<!-- exhaust smoke -->
<g fill="#e8e2da">
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-120,-56" dur="1.3s" repeatCount="indefinite"/>
    <circle cx="308" cy="276" r="6" opacity="0.6">
      <animate attributeName="r" values="5;20;30" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-140,-40" dur="1.3s" begin="-0.43s" repeatCount="indefinite"/>
    <circle cx="308" cy="278" r="6" opacity="0.6">
      <animate attributeName="r" values="4;18;28" dur="1.3s" begin="-0.43s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.28;0" dur="1.3s" begin="-0.43s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-160,-70" dur="1.3s" begin="-0.86s" repeatCount="indefinite"/>
    <circle cx="308" cy="274" r="6" opacity="0.55">
      <animate attributeName="r" values="5;16;26" dur="1.3s" begin="-0.86s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.25;0" dur="1.3s" begin="-0.86s" repeatCount="indefinite"/>
    </circle>
  </g>
</g>

<!-- road dust kicked up by rear wheel -->
<g fill="#d9a76f">
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-90,-24" dur="0.7s" repeatCount="indefinite"/>
    <circle cx="326" cy="322" r="7" opacity="0.7">
      <animate attributeName="r" values="5;16;22" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0" dur="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-110,-10" dur="0.7s" begin="-0.35s" repeatCount="indefinite"/>
    <circle cx="330" cy="326" r="7" opacity="0.7">
      <animate attributeName="r" values="4;14;20" dur="0.7s" begin="-0.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.28;0" dur="0.7s" begin="-0.35s" repeatCount="indefinite"/>
    </circle>
  </g>
</g>

<!-- foreground blur streaks -->
<g stroke="#ffffff" stroke-linecap="round" opacity="0.3">
  <g stroke-width="6">
    <animateTransform attributeName="transform" type="translate" values="880,0;-420,0" dur="0.32s" repeatCount="indefinite"/>
    <line x1="0" y1="384" x2="120" y2="384"/>
  </g>
  <g stroke-width="5">
    <animateTransform attributeName="transform" type="translate" values="880,0;-420,0" dur="0.28s" begin="-0.14s" repeatCount="indefinite"/>
    <line x1="0" y1="344" x2="90" y2="344"/>
  </g>
</g>
</svg>
