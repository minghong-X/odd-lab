<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <style>
    .wheel { animation: spin 1s linear infinite; transform-origin: center; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .pedal { animation: spin 1s linear infinite; transform-origin: 430px 350px; }
    .wing { animation: flap 0.5s ease-in-out infinite alternate; transform-origin: center right; }
    @keyframes flap { from { transform: rotate(0deg); } to { transform: rotate(-20deg); } }
    .leg { animation: pedal 1s linear infinite; transform-origin: 430px 350px; }
    @keyframes pedal { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .body-bounce { animation: bounce 0.5s ease-in-out infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    .scene { animation: move-scene 8s linear infinite; }
    @keyframes move-scene { from { transform: translateX(0); } to { transform: translateX(-200px); } }
    .beak-open { animation: open-beak 1.5s ease-in-out infinite; transform-origin: right center; }
    @keyframes open-beak { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }
  </style>

  <!-- 背景 -->
  <rect width="800" height="500" fill="#87CEEB"/>
  
  <!-- 太阳 -->
  <circle cx="650" cy="80" r="50" fill="#FFD700"/>
  <g stroke="#FFD700" stroke-width="3" stroke-linecap="round">
    <line x1="650" y1="15" x2="650" y2="5"/>
    <line x1="650" y1="145" x2="650" y2="155"/>
    <line x1="585" y1="80" x2="575" y2="80"/>
    <line x1="715" y1="80" x2="725" y2="80"/>
    <line x1="604" y1="34" x2="597" y2="27"/>
    <line x1="696" y1="34" x2="703" y2="27"/>
    <line x1="604" y1="126" x2="597" y2="133"/>
    <line x1="696" y1="126" x2="703" y2="133"/>
  </g>

  <!-- 云朵 -->
  <g opacity="0.8">
    <circle cx="150" cy="100" r="30" fill="white"/>
    <circle cx="180" cy="90" r="35" fill="white"/>
    <circle cx="210" cy="100" r="30" fill="white"/>
  </g>
  <g opacity="0.6">
    <circle cx="450" cy="130" r="25" fill="white"/>
    <circle cx="475" cy="120" r="30" fill="white"/>
    <circle cx="500" cy="130" r="25" fill="white"/>
  </g>

  <!-- 地面 -->
  <rect x="0" y="420" width="800" height="80" fill="#228B22"/>
  <rect x="0" y="420" width="800" height="10" fill="#32CD32"/>
  
  <!-- 移动的地面细节 -->
  <g class="scene">
    <circle cx="100" cy="450" r="3" fill="#1a6b1a"/>
    <circle cx="250" cy="460" r="2" fill="#1a6b1a"/>
    <circle cx="400" cy="445" r="3" fill="#1a6b1a"/>
    <circle cx="550" cy="455" r="2" fill="#1a6b1a"/>
    <circle cx="700" cy="450" r="3" fill="#1a6b1a"/>
    <circle cx="850" cy="460" r="2" fill="#1a6b1a"/>
    <circle cx="1000" cy="445" r="3" fill="#1a6b1a"/>
    <line x1="50" y1="440" x2="80" y2="440" stroke="#1a6b1a" stroke-width="1"/>
    <line x1="300" y1="445" x2="330" y2="445" stroke="#1a6b1a" stroke-width="1"/>
    <line x1="500" y1="435" x2="530" y2="435" stroke="#1a6b1a" stroke-width="1"/>
    <line x1="750" y1="440" x2="780" y2="440" stroke="#1a6b1a" stroke-width="1"/>
    <line x1="950" y1="445" x2="980" y2="445" stroke="#1a6b1a" stroke-width="1"/>
  </g>

  <!-- 自行车整体 -->
  <g class="body-bounce">
    
    <!-- 后轮 -->
    <g style="transform-box: fill-box;">
      <circle cx="300" cy="370" r="55" fill="none" stroke="#333" stroke-width="6"/>
      <circle cx="300" cy="370" r="48" fill="none" stroke="#666" stroke-width="1"/>
      <g class="wheel" style="transform-origin: 300px 370px;">
        <line x1="300" y1="315" x2="300" y2="425" stroke="#555" stroke-width="2"/>
        <line x1="245" y1="370" x2="355" y2="370" stroke="#555" stroke-width="2"/>
        <line x1="261" y1="331" x2="339" y2="409" stroke="#555" stroke-width="2"/>
        <line x1="339" y1="331" x2="261" y2="409" stroke="#555" stroke-width="2"/>
      </g>
      <circle cx="300" cy="370" r="8" fill="#555"/>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="530" cy="370" r="55" fill="none" stroke="#333" stroke-width="6"/>
      <circle cx="530" cy="370" r="48" fill="none" stroke="#666" stroke-width="1"/>
      <g class="wheel" style="transform-origin: 530px 370px;">
        <line x1="530" y1="315" x2="530" y2="425" stroke="#555" stroke-width="2"/>
        <line x1="475" y1="370" x2="585" y2="370" stroke="#555" stroke-width="2"/>
        <line x1="491" y1="331" x2="569" y2="409" stroke="#555" stroke-width="2"/>
        <line x1="569" y1="331" x2="491" y2="409" stroke="#555" stroke-width="2"/>
      </g>
      <circle cx="530" cy="370" r="8" fill="#555"/>
    </g>

    <!-- 车架 -->
    <g stroke="#CC0000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- 主三角架 -->
      <line x1="300" y1="370" x2="430" y2="290"/>
      <line x1="430" y1="290" x2="530" y2="370"/>
      <line x1="300" y1="370" x2="430" y2="350"/>
      <line x1="430" y1="350" x2="530" y2="370"/>
      <!-- 座管 -->
      <line x1="430" y1="290" x2="420" y2="250"/>
      <!-- 车把管 -->
      <line x1="530" y1="370" x2="540" y2="280"/>
      <!-- 座管支撑 -->
      <line x1="420" y1="250" x2="430" y2="350"/>
    </g>

    <!-- 车把 -->
    <g stroke="#333" stroke-width="5" stroke-linecap="round" fill="none">
      <line x1="520" y1="270" x2="560" y2="270"/>
      <line x1="520" y1="270" x2="515" y2="260"/>
      <line x1="560" y1="270" x2="565" y2="260"/>
    </g>

    <!-- 车座 -->
    <ellipse cx="420" cy="248" rx="25" ry="8" fill="#333"/>

    <!-- 链轮 -->
    <circle cx="430" cy="350" r="20" fill="none" stroke="#555" stroke-width="3"/>
    <circle cx="430" cy="350" r="5" fill="#555"/>

    <!-- 链条 -->
    <line x1="300" y1="370" x2="430" y2="350" stroke="#888" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="300" y1="380" x2="430" y2="360" stroke="#888" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- 脚蹬旋转组 -->
    <g class="pedal" style="transform-origin: 430px 350px;">
      <line x1="410" y1="350" x2="450" y2="350" stroke="#333" stroke-width="4"/>
      <rect x="405" y="345" width="12" height="10" rx="2" fill="#555"/>
      <rect x="443" y="345" width="12" height="10" rx="2" fill="#555"/>
    </g>
  </g>

  <!-- 鹈鹕整体 -->
  <g class="body-bounce">
    
    <!-- 鹈鹕的腿（连接到脚蹬） -->
    <g class="leg" style="transform-origin: 430px 350px;">
      <path d="M 425 310 Q 410 330 416 350" fill="none" stroke="#E8A040" stroke-width="8" stroke-linecap="round"/>
      <path d="M 435 310 Q 450 330 444 350" fill="none" stroke="#E8A040" stroke-width="8" stroke-linecap="round"/>
    </g>
    
    <!-- 脚/蹼 -->
    <g class="leg" style="transform-origin: 430px 350px;">
      <ellipse cx="416" cy="350" rx="15" ry="5" fill="#E8A040"/>
      <ellipse cx="444" cy="350" rx="15" ry="5" fill="#E8A040"/>
    </g>

    <!-- 身体 -->
    <ellipse cx="430" cy="280" rx="50" ry="45" fill="#F5F5DC"/>
    <ellipse cx="430" cy="285" rx="45" ry="38" fill="#FFFDD0"/>

    <!-- 翅膀（后面） -->
    <path d="M 410 260 Q 380 280 375 310 Q 390 300 410 290" fill="#E8E0C8" stroke="#D4C8A0" stroke-width="2"/>
    
    <!-- 脖子 -->
    <path d="M 450 260 Q 470 230 480 200 Q 485 185 490 175" fill="none" stroke="#F5F5DC" stroke-width="25" stroke-linecap="round"/>
    <path d="M 450 260 Q 470 230 480 200 Q 485 185 490 175" fill="none" stroke="#FFFDD0" stroke-width="22" stroke-linecap="round"/>

    <!-- 头部 -->
    <ellipse cx="495" cy="170" rx="22" ry="20" fill="#F5F5DC"/>
    <ellipse cx="495" cy="172" rx="20" ry="18" fill="#FFFDD0"/>

    <!-- 眼睛 -->
    <circle cx="505" cy="165" r="6" fill="white"/>
    <circle cx="507" cy="165" r="3.5" fill="#111"/>
    <circle cx="508" cy="164" r="1.2" fill="white"/>

    <!-- 头顶的羽毛 -->
    <path d="M 490 155 Q 485 140 480 130" fill="none" stroke="#E8D080" stroke-width="4" stroke-linecap="round"/>
    <path d="M 495 153 Q 492 138 488 128" fill="none" stroke="#D4B860" stroke-width="3" stroke-linecap="round"/>

    <!-- 大嘴 - 上颚 -->
    <path d="M 515 168 L 580 165 L 585 172 L 515 175 Z" fill="#F4A020" stroke="#E08800" stroke-width="1.5"/>
    
    <!-- 下颚（带喉囊） -->
    <g class="beak-open">
      <path d="M 515 175 L 580 172 Q 575 200 550 205 Q 530 208 515 185 Z" fill="#F4A020" stroke="#E08800" stroke-width="1.5" opacity="0.9"/>
      <path d="M 520 178 L 565 176 Q 560 195 545 200 Q 530 202 520 185 Z" fill="#FFB840" opacity="0.5"/>
    </g>

    <!-- 嘴尖 -->
    <path d="M 580 165 L 590 168 L 585 172" fill="#E08800" stroke="none"/>
    
    <!-- 嘴上的小钩 -->
    <path d="M 588 168 L 590 164" fill="none" stroke="#E08800" stroke-width="2" stroke-linecap="round"/>

    <!-- 翅膀（前面） -->
    <g class="wing">
      <path d="M 440 265 Q 460 285 465 310 Q 445 300 435 285" fill="#E8E0C8" stroke="#D4C8A0" stroke-width="2"/>
      <path d="M 442 275 L 458 300" stroke="#D4C8A0" stroke-width="1" opacity="0.5"/>
      <path d="M 445 270 L 462 295" stroke="#D4C8A0" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- 尾巴 -->
    <path d="M 385 280 Q 370 275 360 280 Q 365 290 380 285" fill="#E8E0C8" stroke="#D4C8A0" stroke-width="1.5"/>
    <path d="M 385 285 Q 368 285 355 292 Q 365 298 380 290" fill="#E0D8C0" stroke="#D4C8A0" stroke-width="1"/>
  </g>

  <!-- 前方移动的小草 -->
  <g class="scene">
    <g transform="translate(0,0)">
      <path d="M 820 420 Q 822 400 818 390" fill="none" stroke="#3a8a3a" stroke-width="2"/>
      <path d="M 825 420 Q 830 400 828 388" fill="none" stroke="#2a7a2a" stroke-width="2"/>
    </g>
    <g transform="translate(150,5)">
      <path d="M 820 420 Q 822 400 818 390" fill="none" stroke="#3a8a3a" stroke-width="2"/>
      <path d="M 825 420 Q 830 400 828 388" fill="none" stroke="#2a7a2a" stroke-width="2"/>
    </g>
    <g transform="translate(-100,-3)">
      <path d="M 850 420 Q 855 395 850 385" fill="none" stroke="#3a8a3a" stroke-width="2"/>
      <path d="M 855 420 Q 862 400 858 386" fill="none" stroke="#2a7a2a" stroke-width="2"/>
    </g>
  </g>

  <!-- 风的效果线 -->
  <g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="340" y1="200" x2="290" y2="200">
      <animate attributeName="x1" values="340;340;340" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="350" y1="230" x2="310" y2="230">
      <animate attributeName="opacity" values="0;0.4;0" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="360" y1="260" x2="320" y2="260">
      <animate attributeName="opacity" values="0.4;0;0.4" dur="1.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 小鸟装饰 -->
  <g fill="none" stroke="#333" stroke-width="2" stroke-linecap="round">
    <path d="M 200 150 Q 210 140 220 150 Q 230 140 240 150">
      <animateTransform attributeName="transform" type="translate" values="0,0;-30,-10;-60,0;-30,10;0,0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 600 100 Q 608 92 616 100 Q 624 92 632 100">
      <animateTransform attributeName="transform" type="translate" values="0,0;-20,-8;-40,0;-20,8;0,0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
