<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5dff9"/>
      <stop offset="1" stop-color="#eaf9ff"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="42" ry="22"/>
      <ellipse cx="34" cy="-10" rx="30" ry="18"/>
      <ellipse cx="-34" cy="-8" rx="27" ry="15"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- sun -->
  <g transform="translate(130 105)">
    <g opacity="0.85" stroke="#ffd60a" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      <line x1="0" y1="-54" x2="0" y2="-72"/>
      <line x1="0" y1="54" x2="0" y2="72"/>
      <line x1="54" y1="0" x2="72" y2="0"/>
      <line x1="-54" y1="0" x2="-72" y2="0"/>
      <line x1="38.2" y1="-38.2" x2="50.9" y2="-50.9"/>
      <line x1="-38.2" y1="-38.2" x2="-50.9" y2="-50.9"/>
      <line x1="38.2" y1="38.2" x2="50.9" y2="50.9"/>
      <line x1="-38.2" y1="38.2" x2="-50.9" y2="50.9"/>
    </g>
    <circle r="42" fill="#ffd60a"/>
    <circle cx="-12" cy="-6" r="3.5" fill="#b58900"/>
    <circle cx="12" cy="-6" r="3.5" fill="#b58900"/>
    <path d="M-12,8 Q0,18 12,8" fill="none" stroke="#b58900" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.95">
    <g>
      <animateTransform attributeName="transform" type="translate" from="880 95" to="-260 95" dur="40s" repeatCount="indefinite"/>
      <use href="#cloud"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="880 170" to="-260 170" dur="52s" begin="-22s" repeatCount="indefinite"/>
      <use href="#cloud" transform="scale(0.7)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="880 55" to="-260 55" dur="64s" begin="-45s" repeatCount="indefinite"/>
      <use href="#cloud" transform="scale(0.5)"/>
    </g>
  </g>

  <!-- hills -->
  <path d="M-20,520 Q140,425 310,520 Z" fill="#b5e48c"/>
  <path d="M400,520 Q600,415 820,520 Z" fill="#95d5b2"/>

  <!-- speed streaks -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.5">
    <line x1="0" y1="208" x2="95" y2="208" stroke-width="5">
      <animateTransform attributeName="transform" type="translate" from="860 0" to="-200 0" dur="0.85s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="330" x2="70" y2="330" stroke-width="4">
      <animateTransform attributeName="transform" type="translate" from="860 0" to="-200 0" dur="0.85s" begin="-0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="160" x2="60" y2="160" stroke-width="4">
      <animateTransform attributeName="transform" type="translate" from="860 0" to="-200 0" dur="0.85s" begin="-0.58s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ground -->
  <rect x="0" y="520" width="800" height="80" fill="#90be6d"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#74a15a" stroke-width="4"/>
  <line x1="0" y1="550" x2="800" y2="550" stroke="#6a994e" stroke-width="5" stroke-dasharray="26 30">
    <animate attributeName="stroke-dashoffset" from="0" to="56" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="580" x2="800" y2="580" stroke="#6a994e" stroke-width="4" stroke-dasharray="14 40" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="0" to="54" dur="1.05s" repeatCount="indefinite"/>
  </line>
  <g>
    <circle cx="95" cy="565" r="5" fill="#ff70a6"/><circle cx="95" cy="565" r="2" fill="#ffe066"/>
    <circle cx="720" cy="548" r="5" fill="#ffffff"/><circle cx="720" cy="548" r="2" fill="#ffb703"/>
    <circle cx="660" cy="586" r="5" fill="#ffd6ff"/><circle cx="660" cy="586" r="2" fill="#ffe066"/>
  </g>

  <!-- shadow -->
  <ellipse cx="400" cy="524" rx="190" ry="10" fill="#3a5a24" opacity="0.18">
    <animate attributeName="rx" values="190;178;190" keyTimes="0;0.5;1" dur="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.18;0.12;0.18" keyTimes="0;0.5;1" dur="0.7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- bike + pelican rig -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" keyTimes="0;0.5;1" dur="0.7s" repeatCount="indefinite"/>

    <!-- rear wheel -->
    <g transform="translate(280 450)">
      <circle r="70" fill="none" stroke="#343a40" stroke-width="10"/>
      <circle r="57" fill="none" stroke="#adb5bd" stroke-width="3"/>
      <g stroke="#ced4da" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        <line x1="0" y1="-56" x2="0" y2="56"/>
        <line x1="-56" y1="0" x2="56" y2="0"/>
        <line x1="-39.6" y1="-39.6" x2="39.6" y2="39.6"/>
        <line x1="39.6" y1="-39.6" x2="-39.6" y2="39.6"/>
      </g>
      <circle r="8" fill="#495057"/>
    </g>

    <!-- front wheel -->
    <g transform="translate(520 450)">
      <circle r="70" fill="none" stroke="#343a40" stroke-width="10"/>
      <circle r="57" fill="none" stroke="#adb5bd" stroke-width="3"/>
      <g stroke="#ced4da" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        <line x1="0" y1="-56" x2="0" y2="56"/>
        <line x1="-56" y1="0" x2="56" y2="0"/>
        <line x1="-39.6" y1="-39.6" x2="39.6" y2="39.6"/>
        <line x1="39.6" y1="-39.6" x2="-39.6" y2="39.6"/>
      </g>
      <circle r="8" fill="#495057"/>
    </g>

    <!-- chain -->
    <line x1="395" y1="439" x2="280" y2="442" stroke="#6c757d" stroke-width="3"/>
    <line x1="395" y1="471" x2="280" y2="458" stroke="#6c757d" stroke-width="3"/>
    <circle cx="280" cy="450" r="9" fill="none" stroke="#495057" stroke-width="4"/>

    <!-- frame -->
    <g stroke="#2a9d8f" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="395" y1="455" x2="280" y2="450"/>
      <line x1="357" y1="360" x2="280" y2="450"/>
      <line x1="395" y1="455" x2="357" y2="357"/>
      <line x1="395" y1="455" x2="505" y2="360"/>
      <line x1="358" y1="360" x2="499" y2="342"/>
      <line x1="496" y1="330" x2="508" y2="368"/>
      <line x1="506" y1="364" x2="520" y2="450"/>
      <line x1="497" y1="332" x2="489" y2="306"/>
    </g>
    <path d="M489,306 C481,300 471,301 466,309" fill="none" stroke="#343a40" stroke-width="6" stroke-linecap="round"/>
    <line x1="357" y1="357" x2="352" y2="340" stroke="#495057" stroke-width="5"/>
    <path d="M330,340 C340,329 366,327 379,336 C383,340 378,346 370,347 L339,350 C331,349 327,345 330,340 Z" fill="#9c6644"/>

    <!-- crankset -->
    <g transform="translate(395 455)">
      <circle r="16" fill="none" stroke="#343a40" stroke-width="5"/>
      <circle r="4" fill="#343a40"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        <line x1="-28" y1="0" x2="28" y2="0" stroke="#343a40" stroke-width="7" stroke-linecap="round"/>
        <g transform="translate(28 0)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.4s" repeatCount="indefinite"/>
            <rect x="-11" y="-4.5" width="22" height="9" rx="3" fill="#212529"/>
          </g>
        </g>
        <g transform="translate(-28 0)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.4s" repeatCount="indefinite"/>
            <rect x="-11" y="-4.5" width="22" height="9" rx="3" fill="#212529"/>
          </g>
        </g>
      </g>
    </g>

    <!-- far leg -->
    <line x1="356" y1="338" x2="367" y2="455" stroke="#d98c8c" stroke-width="10" stroke-linecap="round">
      <animate attributeName="x2" values="367;375.2;395;414.8;423;414.8;395;375.2;367" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="455;435.2;427;435.2;455;474.8;483;474.8;455" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <ellipse cx="367" cy="455" rx="12" ry="6.5" fill="#d98c8c">
      <animate attributeName="cx" values="367;375.2;395;414.8;423;414.8;395;375.2;367" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="455;435.2;427;435.2;455;474.8;483;474.8;455" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="1.4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- tail -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 318 302;4 318 302;0 318 302" keyTimes="0;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      <path d="M318,292 C290,272 262,266 244,272 C266,282 282,292 292,300 C272,300 256,306 246,314 C272,320 300,318 322,310 Z" fill="#dee2e6"/>
    </g>

    <!-- body -->
    <ellipse cx="380" cy="298" rx="80" ry="57" fill="#ffffff" stroke="#dee2e6" stroke-width="2" transform="rotate(-14 380 298)"/>
    <ellipse cx="384" cy="322" rx="56" ry="24" fill="#e9ecef" opacity="0.7" transform="rotate(-10 384 322)"/>

    <!-- near leg -->
    <line x1="368" y1="342" x2="423" y2="455" stroke="#f2a5a5" stroke-width="11" stroke-linecap="round">
      <animate attributeName="x2" values="423;414.8;395;375.2;367;375.2;395;414.8;423" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="455;474.8;483;474.8;455;435.2;427;435.2;455" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <ellipse cx="423" cy="455" rx="13" ry="7" fill="#f2a5a5">
      <animate attributeName="cx" values="423;414.8;395;375.2;367;375.2;395;414.8;423" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="455;474.8;483;474.8;455;435.2;427;435.2;455" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="1.4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- wing -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 335 282;-6 335 282;0 335 282" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite"/>
      <path d="M326,278 C352,250 410,246 440,278 C426,314 368,334 327,318 C317,304 317,290 326,278 Z" fill="#e9ecef" stroke="#ced4da" stroke-width="2"/>
      <path d="M340,300 C370,288 404,286 428,292" fill="none" stroke="#ced4da" stroke-width="2"/>
      <path d="M342,312 C368,304 396,302 416,306" fill="none" stroke="#ced4da" stroke-width="2"/>
    </g>

    <!-- wing-arm holding the handlebar -->
    <path d="M436,286 C448,296 458,303 469,309" fill="none" stroke="#e9ecef" stroke-width="12" stroke-linecap="round"/>
    <circle cx="469" cy="309" r="7.5" fill="#e9ecef" stroke="#ced4da" stroke-width="1.5"/>

    <!-- head, beak and pouch -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 424 268;2.5 424 268;-1.5 424 268;0 424 268" keyTimes="0;0.4;0.75;1" dur="2.6s" repeatCount="indefinite"/>
      <path d="M418,272 C428,244 438,226 448,210" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
      <path d="M440,186 C432,172 418,168 410,176 C420,178 430,184 438,192 Z" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
      <circle cx="452" cy="204" r="25" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
      <ellipse cx="444" cy="216" rx="7" ry="5" fill="#ffc8dd" opacity="0.65"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 476 214;3.5 476 214;-2.5 476 214;0 476 214" keyTimes="0;0.35;0.7;1" dur="1.9s" repeatCount="indefinite"/>
        <path d="M468,206 C512,210 554,216 588,221 C580,247 546,262 510,255 C488,250 473,231 468,206 Z" fill="#fb8500" stroke="#e07a00" stroke-width="1.5"/>
      </g>
      <path d="M466,190 C510,192 556,203 592,217 L589,223 C550,212 508,206 466,208 Z" fill="#ffb703" stroke="#e89b00" stroke-width="1.5"/>
      <path d="M498,197 C528,200 556,207 580,215" fill="none" stroke="#e89b00" stroke-width="1.2" opacity="0.7"/>
      <circle cx="458" cy="197" r="4.5" fill="#212529"/>
      <circle cx="459.7" cy="195.3" r="1.4" fill="#ffffff"/>
    </g>

    <!-- fluttering scarf -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 420 242;9 420 242;-4 420 242" keyTimes="0;0.5;1" dur="0.55s" repeatCount="indefinite"/>
      <path d="M420,238 C400,230 382,234 368,226 C376,244 394,254 416,252 Z" fill="#d00000"/>
    </g>
    <ellipse cx="430" cy="243" rx="19" ry="9" fill="#e63946" transform="rotate(-28 430 243)"/>
  </g>
</svg>