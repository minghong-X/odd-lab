<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="lightblue"/>
  <rect x="0" y="350" width="800" height="50" fill="brown"/>
  <g id="bicycle">
    <!-- 后轮 -->
    <circle cx="100" cy="300" r="30" fill="none" stroke="black" stroke-width="5">
      <animateTransform attributeName="transform" type="rotate" from="0 100 300" to="360 100 300" dur="1s" repeatCount="indefinite"/>
    </circle>
    <!-- 前轮 -->
    <circle cx="250" cy="300" r="30" fill="none" stroke="black" stroke-width="5">
      <animateTransform attributeName="transform" type="rotate" from="0 250 300" to="360 250 300" dur="1s" repeatCount="indefinite"/>
    </circle>
    <!-- 车架 -->
    <polyline points="100,300 150,250 \(|) 250,300 150,250 180,200" stroke="black" stroke-width="5" fill="none"/>
    <!-- 座位 -->
    <rect x="170" y="200" width="20" height="10" fill="black"/>
    <!-- 把手 -->
    <line x1="250" y1="300" x2="250" y2="220" stroke="black" stroke-width="5"/>
    <line x1="220" y1="220" x2="280" y2="220" stroke="black" stroke-width="5"/>
    <!-- 踏板 -->
    <circle cx="150" cy="250" r="10" fill="gray">
      <animateTransform attributeName="transform" type="rotate" from="0 150 250" to="360 150 250" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g id="pelican">
    <!-- 鹈鹕身体 -->
    <ellipse cx="180" cy="180" rx="40" ry="60" fill="white" stroke="black" stroke-width="2"/>
    <!-- 鹈鹕头 -->
    <circle cx="180" cy="150" r="30" fill="white" stroke="black" stroke-width="2"/>
    <!-- 鹈鹕嘴巴 -->
    <path d="M210,150 L250,140 L210,130 Z" fill="orange"/>
    <!-- 鹈鹕眼睛 -->
    <circle cx="190" cy="145" r="5" fill="black"/>
    <!-- 鹈鹕翅膀 -->
    <path id="wing" d="M140,180 C120,160 100,140 120,120 C140,100 160,120 180,140" fill="gray" stroke="black" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 180 180; 20 180 180; 0 180 180" dur="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 整体移动动画 -->
  <g id="moving-pelican-bike">
    <animateTransform attributeName="transform" type="translate" from="-200 0" to="800 0" dur="5s" repeatCount="indefinite"/>
    <use href="#bicycle"/>
    <use href="#pelican"/>
  </g>
</svg>