<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A pelican riding a bicycle">
  <title>Pelican on a Bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd3ef"/>
      <stop offset="60%" stop-color="#c9ecf7"/>
      <stop offset="100%" stop-color="#eef9fc"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b6f76"/>
      <stop offset="100%" stop-color="#4a4e55"/>
    </linearGradient>
    <radialGradient id="bodyFill" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f4f6f8"/>
      <stop offset="100%" stop-color="#d9dee5"/>
    </radialGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc861"/>
      <stop offset="100%" stop-color="#f0921f"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd07a"/>
      <stop offset="100%" stop-color="#e8801c"/>
    </linearGradient>

    <g id="wheel">
      <circle r="50" fill="none" stroke="#23262b" stroke-width="8"/>
      <circle r="43" fill="none" stroke="#cfd4db" stroke-width="3"/>
      <g stroke="#e8ecf1" stroke-width="2">
        <line x1="0" y1="-43" x2="0" y2="43"/>
        <line x1="0" y1="-43" x2="0" y2="43" transform="rotate(30)"/>
        <line x1="0" y1="-43" x2="0" y2="43" transform="rotate(60)"/>
        <line x1="0" y1="-43" x2="0" y2="43" transform="rotate(90)"/>
        <line x1="0" y1="-43" x2="0" y2="43" transform="rotate(120)"/>
        <line x1="0" y1="-43" x2="0" y2="43" transform="rotate(150)"/>
      </g>
      <circle cx="0" cy="-38" r="3.5" fill="#e04b3a"/>
      <circle r="6.5" fill="#9aa0a8"/>
      <circle r="2.5" fill="#5d636b"/>
    </g>

    <g id="cloud">
      <ellipse cx="0" cy="0" rx="42" ry="22" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="34" cy="6" rx="30" ry="16" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="-32" cy="8" rx="26" ry="14" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="8" cy="-14" rx="24" ry="16" fill="#ffffff" opacity="0.95"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="800" height="410" fill="url(#sky)"/>
  <circle cx="678" cy="82" r="38" fill="#fff3b0"/>
  <circle cx="678" cy="82" r="52" fill="#fff3b0" opacity="0.35"/>

  <!-- clouds drifting -->
  <g>
    <g opacity="0.9">
      <use href="#cloud" x="0" y="0" transform="translate(120,80)">
        <animateTransform attributeName="transform" type="translate" from="900 80" to="-140 80" dur="16s" repeatCount="indefinite"/>
      </use>
    </g>
    <g opacity="0.75">
      <use href="#cloud" transform="translate(400,150) scale(0.7)">
        <animateTransform attributeName="transform" type="translate" from="900 150" to="-140 150" dur="11s" repeatCount="indefinite"/>
      </use>
    </g>
    <g opacity="0.6">
      <use href="#cloud" transform="translate(600,45) scale(0.5)">
        <animateTransform attributeName="transform" type="translate" from="900 45" to="-140 45" dur="22s" repeatCount="indefinite"/>
      </use>
    </g>
  </g>

  <!-- distant hills scrolling -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="9s" repeatCount="indefinite"/>
    <path d="M0 400 Q 100 320 200 400 Q 300 316 400 400 Q 500 320 600 400 Q 700 316 800 400 Q 900 320 1000 400 Q 1100 316 1200 400 L1200 410 L0 410 Z" fill="#8ec98a"/>
    <path d="M0 402 Q 60 356 130 402 Q 210 350 280 402 Q 360 356 430 402 Q 510 350 580 402 Q 660 356 730 402 Q 810 350 880 402 Q 960 356 1030 402 Q 1110 350 1180 402 L1200 410 L0 410 Z" fill="#6cae70"/>
  </g>

  <!-- road -->
  <rect y="400" width="800" height="100" fill="url(#road)"/>
  <rect y="398" width="800" height="4" fill="#8e939b"/>
  <g fill="#f5e6a8">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="0.34s" repeatCount="indefinite"/>
    <rect x="0" y="446" width="90" height="7" rx="3"/>
    <rect x="160" y="446" width="90" height="7" rx="3"/>
    <rect x="320" y="446" width="90" height="7" rx="3"/>
    <rect x="480" y="446" width="90" height="7" rx="3"/>
    <rect x="640" y="446" width="90" height="7" rx="3"/>
    <rect x="800" y="446" width="90" height="7" rx="3"/>
    <rect x="960" y="446" width="90" height="7" rx="3"/>
  </g>

  <!-- speed streaks -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.55">
    <line x1="0" y1="200" x2="70" y2="200" stroke-width="4">
      <animate attributeName="x1" values="760;-120" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="830;-50" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="262" x2="50" y2="262" stroke-width="3">
      <animate attributeName="x1" values="820;-100" dur="0.55s" repeatCount="indefinite" begin="0.2s"/>
      <animate attributeName="x2" values="870;-50" dur="0.55s" repeatCount="indefinite" begin="0.2s"/>
    </line>
    <line x1="0" y1="330" x2="60" y2="330" stroke-width="3">
      <animate attributeName="x1" values="800;-120" dur="0.62s" repeatCount="indefinite" begin="0.35s"/>
      <animate attributeName="x2" values="860;-60" dur="0.62s" repeatCount="indefinite" begin="0.35s"/>
    </line>
  </g>

  <!-- ================= PELICAN + BICYCLE ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0; 0 -2; 0 0" dur="0.9s" repeatCount="indefinite"/>

    <ellipse cx="410" cy="406" rx="170" ry="12" fill="#1b1e22" opacity="0.28"/>

    <!-- far leg -->
    <g stroke="#c9ced6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M395 300 L420 331 L386 352">
        <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
          values="M395 300 L420 331 L386 352;
                  M395 300 L430 320 L393 335;
                  M395 300 L435 297 L410 328;
                  M395 300 L435 296 L427 335;
                  M395 300 L433 312 L434 352;
                  M395 300 L422 329 L427 369;
                  M395 300 L412 336 L410 376;
                  M395 300 L414 335 L393 369;
                  M395 300 L420 331 L386 352"/>
      </path>
    </g>
    <ellipse cx="386" cy="352" rx="9" ry="5.5" fill="#cf7a20">
      <animate attributeName="cx" dur="0.9s" repeatCount="indefinite" values="386;393;410;427;434;427;410;393;386"/>
      <animate attributeName="cy" dur="0.9s" repeatCount="indefinite" values="352;335;328;335;352;369;376;369;352"/>
    </ellipse>

    <!-- wheels -->
    <g transform="translate(275,352)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
        <use href="#wheel"/>
      </g>
    </g>
    <g transform="translate(545,352)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
        <use href="#wheel"/>
      </g>
    </g>

    <!-- chain -->
    <g stroke="#4c525a" stroke-width="3.5" fill="none">
      <path d="M410 344 L275 344" stroke-dasharray="7 5">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.25s" repeatCount="indefinite"/>
      </path>
      <path d="M410 360 L275 360" stroke-dasharray="7 5">
        <animate attributeName="stroke-dashoffset" from="0" to="24" dur="0.25s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- frame -->
    <g stroke="#e04b3a" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="410" y1="352" x2="275" y2="352"/>
      <line x1="357" y1="292" x2="275" y2="352"/>
      <line x1="410" y1="352" x2="357" y2="292"/>
      <line x1="357" y1="292" x2="505" y2="276"/>
      <line x1="410" y1="352" x2="518" y2="298"/>
      <line x1="505" y1="276" x2="521" y2="300"/>
      <line x1="521" y1="300" x2="545" y2="352"/>
    </g>
    <g stroke="#2f3438" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M505 276 L497 260"/>
      <path d="M470 252 Q 497 256 520 268"/>
    </g>
    <ellipse cx="468" cy="251" rx="8" ry="6" fill="#23262b"/>
    <!-- saddle -->
    <path d="M330 292 Q 357 280 384 292 Q 357 300 330 292 Z" fill="#2f3438"/>

    <!-- crank -->
    <g transform="translate(410,352)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
        <circle r="16" fill="none" stroke="#9aa0a8" stroke-width="3"/>
        <rect x="-3" y="-25" width="6" height="50" rx="3" fill="#7d838b"/>
      </g>
      <circle r="5" fill="#5d636b"/>
    </g>

    <!-- pelican body -->
    <g>
      <!-- tail -->
      <path d="M322 250 Q 288 240 274 256 Q 296 262 306 272 Q 296 282 300 292 Q 322 282 330 268 Z" fill="#e6eaef"/>
      <ellipse cx="378" cy="258" rx="61" ry="47" fill="url(#bodyFill)"/>
      <path d="M330 288 Q 378 312 428 286 Q 400 306 366 306 Z" fill="#dfe4ea" opacity="0.8"/>

      <!-- wing -->
      <path d="M356 236 Q 404 214 452 244 Q 420 262 372 262 Q 350 252 356 236 Z" fill="#eef1f5" stroke="#d3d9e0" stroke-width="2">
        <animate attributeName="d" dur="1.3s" repeatCount="indefinite"
          values="M356 236 Q 404 214 452 244 Q 420 262 372 262 Q 350 252 356 236 Z;
                  M356 234 Q 406 208 452 240 Q 420 258 372 258 Q 350 250 356 234 Z;
                  M356 236 Q 404 214 452 244 Q 420 262 372 262 Q 350 252 356 236 Z"/>
      </path>
      <!-- wing arm to handlebar -->
      <path d="M430 244 Q 456 244 468 250" stroke="#eef1f5" stroke-width="14" stroke-linecap="round" fill="none"/>

      <!-- neck + head -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-2 420 240; 1.5 420 240; -2 420 240" dur="1.6s" repeatCount="indefinite"/>
        <path d="M404 268 Q 430 214 470 194 L500 208 Q 456 226 436 274 Z" fill="#f7f9fb"/>
        <ellipse cx="503" cy="182" rx="27" ry="23" fill="#fbfcfd"/>
        <!-- crest -->
        <path d="M486 162 Q 492 146 504 152 Q 500 158 500 164 Z" fill="#e9edf2"/>
        <!-- helmet -->
        <path d="M478 176 A 27 25 0 0 1 528 172 L528 176 Q 503 166 478 180 Z" fill="#2b6cb0"/>
        <path d="M528 172 Q 540 172 542 180 L528 178 Z" fill="#1f4f88"/>

        <!-- beak -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 512 186; 3 512 186; 0 512 186" dur="2.2s" repeatCount="indefinite"/>
          <path d="M519 190 Q 562 240 610 204 Q 566 210 521 187 Z" fill="url(#pouch)">
            <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
              values="M519 190 Q 562 240 610 204 Q 566 210 521 187 Z;
                      M519 190 Q 562 250 610 204 Q 566 216 521 187 Z;
                      M519 190 Q 562 240 610 204 Q 566 210 521 187 Z"/>
          </path>
          <path d="M516 170 Q 566 170 618 198 Q 566 196 519 190 Z" fill="url(#beak)"/>
          <path d="M516 174 Q 566 176 612 197 Q 566 190 519 186 Z" fill="#ffdd9c" opacity="0.5"/>
        </g>

        <!-- eye -->
        <ellipse cx="510" cy="180" rx="5.5" ry="5" fill="#ffffff">
          <animate attributeName="ry" dur="3.6s" repeatCount="indefinite" values="5;5;0.6;5;5" keyTimes="0;0.86;0.9;0.94;1"/>
        </ellipse>
        <circle cx="511" cy="180" r="3" fill="#23262b">
          <animate attributeName="r" dur="3.6s" repeatCount="indefinite" values="3;3;0.4;3;3" keyTimes="0;0.86;0.9;0.94;1"/>
        </circle>
      </g>
    </g>

    <!-- near leg -->
    <g stroke="#f2f4f7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M395 300 L433 312 L434 352">
        <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
          values="M395 300 L433 312 L434 352;
                  M395 300 L422 329 L427 369;
                  M395 300 L412 336 L410 376;
                  M395 300 L414 335 L393 369;
                  M395 300 L420 331 L386 352;
                  M395 300 L430 320 L393 335;
                  M395 300 L435 297 L410 328;
                  M395 300 L435 296 L427 335;
                  M395 300 L433 312 L434 352"/>
      </path>
    </g>
    <ellipse cx="434" cy="352" rx="11" ry="6" fill="#f0921f">
      <animate attributeName="cx" dur="0.9s" repeatCount="indefinite" values="434;427;410;393;386;393;410;427;434"/>
      <animate attributeName="cy" dur="0.9s" repeatCount="indefinite" values="352;369;376;369;352;335;328;335;352"/>
    </ellipse>
  </g>

  <!-- dust puffs -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="250" cy="398" r="9">
      <animate attributeName="cx" values="250;150" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="398;372" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;16" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="398" r="7">
      <animate attributeName="cx" values="250;170" dur="1.4s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="cy" values="400;386" dur="1.4s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="r" values="3;13" dur="1.4s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.5;0" dur="1.4s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
</svg>
