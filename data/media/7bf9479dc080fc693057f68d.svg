<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a051b"/>
      <stop offset="40%" stop-color="#240a34"/>
      <stop offset="75%" stop-color="#5a1147"/>
      <stop offset="100%" stop-color="#f73859"/>
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="50%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#5a1147"/>
    </linearGradient>

    <!-- Headlight Beam Gradient -->
    <linearGradient id="headlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Chrome/Metal Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9aa0a6"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#5f6368"/>
      <stop offset="100%" stop-color="#e8eaed"/>
    </linearGradient>

    <!-- Wheel Symbol -->
    <g id="wheel">
      <!-- Outer Tire -->
      <circle cx="0" cy="0" r="48" fill="#121318" stroke="#252830" stroke-width="4"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#3a3f4d" stroke-width="3"/>
      <!-- Rim -->
      <circle cx="0" cy="0" r="28" fill="#0d0e12" stroke="url(#chromeGrad)" stroke-width="4"/>
      <!-- Spokes -->
      <path d="M 0,-28 L 0,28 M -28,0 L 28,0 M -20,-20 L 20,20 M -20,20 L 20,-20" stroke="url(#chromeGrad)" stroke-width="2.5"/>
      <!-- Inner Hub -->
      <circle cx="0" cy="0" r="12" fill="#ffb703" stroke="#ffffff" stroke-width="2"/>
      <!-- Rotating Tread Marks -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="10 18" opacity="0.7"/>
    </g>
  </defs>

  <!-- Background Sky -->
  <rect width="900" height="380" fill="url(#skyGrad)"/>

  <!-- Synthwave Retro Sun -->
  <circle cx="450" cy="250" r="90" fill="url(#sunGrad)"/>

  <!-- Sun Horizon Bars (Retro Effect) -->
  <rect x="350" y="240" width="200" height="3" fill="#240a34"/>
  <rect x="340" y="252" width="220" height="4" fill="#240a34"/>
  <rect x="330" y="267" width="240" height="6" fill="#240a34"/>
  <rect x="320" y="285" width="260" height="8" fill="#240a34"/>

  <!-- Distant Mountains -->
  <path d="M 0,380 L 120,300 L 220,340 L 350,270 L 480,350 L 620,280 L 750,340 L 900,260 L 900,380 Z" fill="#1d0a34" opacity="0.9"/>
  <path d="M 0,380 L 80,330 L 190,360 L 410,295 L 530,360 L 680,310 L 820,360 L 900,320 L 900,380 Z" fill="#120524"/>

  <!-- Road Base -->
  <rect x="0" y="380" width="900" height="170" fill="#090514"/>
  <!-- Horizon Line -->
  <line x1="0" y1="380" x2="900" y2="380" stroke="#ff0055" stroke-width="4"/>

  <!-- Animated Speed Lines on Road -->
  <g stroke="#00f0ff" opacity="0.6">
    <line x1="0" y1="405" x2="900" y2="405" stroke-width="2" stroke-dasharray="40 30">
      <animate attributeName="stroke-dashoffset" from="0" to="-70" dur="0.12s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="445" x2="900" y2="445" stroke-width="4" stroke-dasharray="70 50">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="0.12s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="500" x2="900" y2="500" stroke-width="7" stroke-dasharray="120 80">
      <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="0.12s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Air Speed Lines -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.25" stroke-linecap="round">
    <line x1="900" y1="80" x2="700" y2="80">
      <animate attributeName="x1" values="1000; -200" dur="0.35s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="800; -400" dur="0.35s" repeatCount="indefinite"/>
    </line>
    <line x1="900" y1="160" x2="650" y2="160">
      <animate attributeName="x1" values="1100; -100" dur="0.25s" begin="0.08s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="850; -350" dur="0.25s" begin="0.08s" repeatCount="indefinite"/>
    </line>
    <line x1="900" y1="240" x2="750" y2="240">
      <animate attributeName="x1" values="1050; -150" dur="0.3s" begin="0.15s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="900; -300" dur="0.3s" begin="0.15s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- MAIN ASSEMBLY: MOTORCYCLE + CROCODILE (Bouncing Group) -->
  <g id="rider-and-bike">
    <!-- Engine/Road Vibration Animation -->
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-3; 0,2; 0,-4; 0,1; 0,0"
      dur="0.22s" repeatCount="indefinite"/>

    <!-- Exhaust Smoke Puffs -->
    <g id="exhaust-smoke">
      <circle cx="190" cy="385" r="8" fill="#ff0055" opacity="0.8">
        <animate attributeName="cx" values="190; 90; -10" dur="0.35s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="385; 375; 355" dur="0.35s" repeatCount="indefinite"/>
        <animate attributeName="r" values="6; 22; 45" dur="0.35s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8; 0.4; 0" dur="0.35s" repeatCount="indefinite"/>
      </circle>
      <circle cx="190" cy="385" r="6" fill="#ffb703" opacity="0.9">
        <animate attributeName="cx" values="190; 100; 10" dur="0.35s" begin="0.12s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="385; 380; 365" dur="0.35s" begin="0.12s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5; 18; 38" dur="0.35s" begin="0.12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9; 0.3; 0" dur="0.35s" begin="0.12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="190" cy="385" r="5" fill="#00f0ff" opacity="0.7">
        <animate attributeName="cx" values="190; 110; 20" dur="0.35s" begin="0.22s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="385; 370; 350" dur="0.35s" begin="0.22s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4; 15; 30" dur="0.35s" begin="0.22s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7; 0.2; 0" dur="0.35s" begin="0.22s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Headlight Beam (Cast on Ground/Air) -->
    <polygon points="565,270 900,210 900,430 565,295" fill="url(#headlightGrad)"/>

    <!-- Motorcycle Rear Wheel -->
    <g>
      <use href="#wheel" x="250" y="380">
        <animateTransform attributeName="transform" type="rotate" from="0 250 380" to="360 250 380" dur="0.1s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- Motorcycle Front Wheel -->
    <g>
      <use href="#wheel" x="580" y="380">
        <animateTransform attributeName="transform" type="rotate" from="0 580 380" to="360 580 380" dur="0.1s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- Motorcycle Frame & Body Details -->
    <!-- Exhaust Pipe -->
    <path d="M 360,375 L 300,390 L 195,385" stroke="url(#chromeGrad)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 360,375 L 300,390 L 195,385" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
    <circle cx="195" cy="385" r="7" fill="#222" stroke="url(#chromeGrad)" stroke-width="2"/>

    <!-- Rear Frame Suspension -->
    <path d="M 250,380 L 320,320 L 370,360 Z" fill="#181920" stroke="#3a3f4d" stroke-width="4"/>
    <line x1="265" y1="370" x2="310" y2="330" stroke="#ffb703" stroke-width="8" stroke-linecap="round"/>

    <!-- Engine Block -->
    <rect x="340" y="325" width="75" height="50" rx="8" fill="#2b2d36" stroke="url(#chromeGrad)" stroke-width="3"/>
    <!-- Engine Cooling Fins -->
    <line x1="348" y1="335" x2="408" y2="335" stroke="#111" stroke-width="3"/>
    <line x1="348" y1="343" x2="408" y2="343" stroke="#111" stroke-width="3"/>
    <line x1="348" y1="351" x2="408" y2="351" stroke="#111" stroke-width="3"/>
    <line x1="348" y1="359" x2="408" y2="359" stroke="#111" stroke-width="3"/>
    <circle cx="380" cy="347" r="10" fill="#ff0055" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Main Body / Gas Tank (Sleek Racing Style) -->
    <path d="M 330,315 C 350,290 410,280 490,295 C 510,300 520,320 480,335 C 430,345 360,340 330,315 Z" fill="#e60033" stroke="#ff2a55" stroke-width="2"/>
    <!-- Tank Highlight Stripe -->
    <path d="M 360,298 C 410,290 470,298 495,308" stroke="#ffb703" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 370,308 C 410,302 460,308 485,316" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Front Fork & Steering Suspension -->
    <line x1="580" y1="380" x2="505" y2="250" stroke="url(#chromeGrad)" stroke-width="9" stroke-linecap="round"/>
    <line x1="568" y1="380" x2="495" y2="250" stroke="#252830" stroke-width="5" stroke-linecap="round"/>

    <!-- Handlebars -->
    <path d="M 500,250 L 475,245 M 500,250 L 515,235" stroke="#111115" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="472" cy="244" r="5" fill="#ff0055"/>

    <!-- Seat -->
    <path d="M 290,320 C 310,305 350,305 375,320 C 350,330 310,330 290,320 Z" fill="#121318" stroke="#333" stroke-width="2"/>

    <!-- Front Fender -->
    <path d="M 540,345 C 550,325 580,325 610,340" fill="none" stroke="#e60033" stroke-width="6" stroke-linecap="round"/>

    <!-- Headlight Housing -->
    <polygon points="510,265 540,255 545,285 515,290" fill="#1a1a1a" stroke="url(#chromeGrad)" stroke-width="2"/>
    <ellipse cx="538" cy="272" rx="4" ry="12" fill="#00f0ff"/>

    <!-- CROCODILE RIDER -->
    <!-- Wiggling Tail -->
    <g id="croc-tail">
      <path d="M 300,315 Q 220,320 140,285 Q 210,345 290,335 Z" fill="#2d8a4e" stroke="#1b522c" stroke-width="3">
        <animate attributeName="d"
          values="M 300,315 Q 220,305 140,270 Q 210,345 290,335 Z;
                  M 300,315 Q 220,335 140,300 Q 210,340 290,335 Z;
                  M 300,315 Q 220,305 140,270 Q 210,345 290,335 Z"
          dur="0.18s" repeatCount="indefinite"/>
      </path>
      <!-- Tail Spikes -->
      <path d="M 250,310 L 242,295 L 232,310 M 210,302 L 202,288 L 192,302 M 170,292 L 162,278 L 152,292" stroke="#154222" stroke-width="3" fill="#72c259"/>
    </g>

    <!-- Back Leg & Biker Boot -->
    <path d="M 330,320 L 370,365 L 400,365" stroke="#181824" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 330,320 L 370,365 L 400,365" stroke="#2d8a4e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3"/>
    <!-- Boot -->
    <path d="M 390,355 L 415,355 C 420,355 420,375 410,375 L 385,375 Z" fill="#0d0e12" stroke="#ff0055" stroke-width="1.5"/>

    <!-- Crocodile Torso & Biker Leather Jacket -->
    <path d="M 310,320 C 325,260 380,225 450,220 C 470,245 465,285 415,325 Z" fill="#181824" stroke="#2b2d42" stroke-width="2"/>
    <!-- Jacket Red Zipper & Lapel -->
    <path d="M 420,225 L 400,320" stroke="#ff0055" stroke-width="4" fill="none"/>
    <path d="M 435,230 L 410,270" stroke="#ffffff" stroke-width="3" fill="none"/>
    <!-- Spikes on Shoulder -->
    <path d="M 355,248 L 358,238 L 365,248 M 370,242 L 373,232 L 380,242 M 385,238 L 388,228 L 395,238" stroke="#ffffff" stroke-width="2" fill="#ffb703"/>

    <!-- Flowing Biker Scarf -->
    <path fill="#ff0055" stroke="#a00034" stroke-width="1.5">
      <animate attributeName="d"
        values="M 435,215 Q 330,170 210,190 Q 320,220 435,230 Z;
                M 435,215 Q 340,225 220,170 Q 330,205 435,230 Z;
                M 435,215 Q 330,170 210,190 Q 320,220 435,230 Z"
        dur="0.15s" repeatCount="indefinite"/>
    </path>

    <!-- Crocodile Head & Snout -->
    <g id="croc-head">
      <!-- Neck Base -->
      <path d="M 420,230 C 430,200 450,190 470,195 L 460,235 Z" fill="#2d8a4e"/>

      <!-- Upper Snout & Head Structure -->
      <path d="M 440,210 C 445,170 490,165 580,185 C 595,190 595,202 580,208 L 480,212 C 460,212 445,210 440,210 Z" fill="#2d8a4e" stroke="#1b522c" stroke-width="2"/>

      <!-- Snout Highlights / Scale Ridge -->
      <path d="M 470,175 Q 520,175 575,188" stroke="#72c259" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- Lower Jaw -->
      <path d="M 465,212 L 565,212 C 575,212 575,224 560,224 L 470,222 Z" fill="#236b3c" stroke="#1b522c" stroke-width="2"/>

      <!-- Open Mouth Interior & Sharp Teeth -->
      <path d="M 475,210 L 565,210 L 558,218 L 475,218 Z" fill="#9e2a2b"/>
      <!-- Teeth (ZigZag Path) -->
      <path d="M 480,210 L 485,216 L 490,210 L 495,216 L 500,210 L 505,216 L 510,210 L 515,216 L 520,210 L 525,216 L 530,210 L 535,216 L 540,210 L 545,216 L 550,210 L 555,216" stroke="#ffffff" stroke-width="25" fill="none" stroke-dasharray="2 4"/>

      <!-- Yellow Underbelly/Jaw Accent -->
      <path d="M 470,222 C 510,225 540,225 560,222 C 540,228 490,230 465,224 Z" fill="#aacc00"/>

      <!-- Nostril -->
      <ellipse cx="568" cy="193" rx="3" ry="2" fill="#154222"/>

      <!-- Bumps/Scales on Snout -->
      <path d="M 510,176 Q 515,170 520,177 Q 525,171 530,178" stroke="#154222" stroke-width="3" fill="none"/>

      <!-- Biker Helmet -->
      <path d="M 435,195 C 430,150 485,140 520,168 C 500,175 450,175 435,195 Z" fill="#0d0e12" stroke="#ff0055" stroke-width="2.5"/>
      <!-- Helmet Racing Stripe -->
      <path d="M 445,160 C 475,150 505,158 518,167" stroke="#ffb703" stroke-width="4" fill="none"/>

      <!-- Cool Aviator Goggles -->
      <path d="M 455,182 L 515,188" stroke="#111" stroke-width="6"/>
      <!-- Goggle Lens Right -->
      <ellipse cx="510" cy="188" rx="14" ry="11" fill="#00f0ff" stroke="#ffb703" stroke-width="3"/>
      <ellipse cx="513" cy="185" rx="4" ry="3" fill="#ffffff" opacity="0.8"/>
      <!-- Goggle Lens Left (Slightly behind) -->
      <ellipse cx="482" cy="184" rx="12" ry="10" fill="#00f0ff" stroke="#ffb703" stroke-width="3"/>
      <ellipse cx="484" cy="182" rx="3" ry="2" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Arm & Claw Gripping Handlebars -->
    <g id="croc-arm">
      <!-- Sleeve -->
      <path d="M 430,240 Q 470,242 500,248" stroke="#181824" stroke-width="18" stroke-linecap="round" fill="none"/>
      <path d="M 430,240 Q 470,242 500,248" stroke="#ff0055" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Green Forearm/Hand -->
      <path d="M 495,248 L 512,246" stroke="#2d8a4e" stroke-width="10" stroke-linecap="round"/>
      <!-- Claws Wrapped Around Grip -->
      <circle cx="514" cy="244" r="3" fill="#ffffff"/>
      <circle cx="516" cy="248" r="3" fill="#ffffff"/>
      <circle cx="513" cy="252" r="3" fill="#ffffff"/>
    </g>

    <!-- Wheel Ground Sparks / Dust Particles -->
    <g fill="#ffb703">
      <circle cx="240" cy="428" r="2.5">
        <animate attributeName="cx" values="250; 180; 110" dur="0.12s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="428; 432; 435" dur="0.12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1; 0.6; 0" dur="0.12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="570" cy="428" r="3">
        <animate attributeName="cx" values="580; 510; 440" dur="0.1s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="428; 430; 434" dur="0.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1; 0.5; 0" dur="0.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>