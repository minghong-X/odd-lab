<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      @keyframes pedal {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes bikeMove {
        0% { transform: translate(0, 0); }
        25% { transform: translate(5px, -5px); }
        50% { transform: translate(0, 0); }
        75% { transform: translate(-5px, -5px); }
        100% { transform: translate(0, 0); }
      }
      @keyframes birdBob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .bike-assembly {
        transform-origin: center center;
        animation: bikeMove 0.5s infinite linear;
      }
      .pedal-group {
        transform-origin: 400px 460px;
        animation: pedal 0.5s infinite linear;
      }
      .bird-group {
        transform-origin: center center;
        animation: birdBob 0.5s infinite ease-in-out;
      }
      .cloud {
        animation: cloudMove 20s infinite linear;
      }
      @keyframes cloudMove {
        from { transform: translateX(-200px); }
        to { transform: translateX(850px); }
      }
      .wheel-spin {
        transform-origin: center center;
        animation: wheelSpin 1s infinite linear;
      }
      @keyframes wheelSpin {
        to { transform: rotate(360deg); }
      }
    </style>
    <clipPath id="wheelClip1">
      <circle cx="310" cy="510" r="70"/>
    </clipPath>
    <clipPath id="wheelClip2">
      <circle cx="500" cy="510" r="70"/>
    </clipPath>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="#87CEEB"/>
  
  <!-- Sun -->
  <circle cx="650" cy="100" r="50" fill="#FFD700"/>
  <g fill="#FFD700" stroke="#FFD700" stroke-width="3">
    <line x1="650" y1="40" x2="650" y2="20"/>
    <line x1="650" y1="160" x2="650" y2="180"/>
    <line x1="590" y1="100" x2="570" y2="100"/>
    <line x1="710" y1="100" x2="730" y2="100"/>
    <line x1="608" y1="58" x2="594" y2="44"/>
    <line x1="692" y1="142" x2="706" y2="156"/>
    <line x1="608" y1="142" x2="594" y2="156"/>
    <line x1="692" y1="58" x2="706" y2="44"/>
  </g>

  <!-- Clouds -->
  <g class="cloud" fill="#FFFFFF" opacity="0.8">
    <ellipse cx="150" cy="80" rx="60" ry="30"/>
    <ellipse cx="190" cy="70" rx="40" ry="25"/>
    <ellipse cx="110" cy="70" rx="40" ry="25"/>
  </g>
  <g class="cloud" fill="#FFFFFF" opacity="0.8" style="animation-duration: 30s">
    <ellipse cx="400" cy="50" rx="50" ry="25"/>
    <ellipse cx="430" cy="40" rx="30" ry="20"/>
  </g>

  <!-- Ground -->
  <rect y="520" width="800" height="80" fill="#90EE90"/>
  <path d="M0 520 Q 100 510 200 520 T 400 520 T 600 520 T 800 520" stroke="#228B22" stroke-width="4" fill="none"/>
  
  <!-- Road -->
  <path d="M0 560 Q 200 540 400 560 T 800 560" stroke="#696969" stroke-width="40" fill="none"/>
  <path d="M0 560 Q 200 540 400 560 T 800 560" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="20,20" fill="none"/>

  <g class="bike-assembly">
    <!-- Bicycle -->
    <g fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- Rear Wheel -->
      <circle cx="310" cy="510" r="70"/>
      <!-- Front Wheel -->
      <circle cx="500" cy="510" r="70"/>
      
      <!-- Frame -->
      <!-- Seat Tube -->
      <line x1="310" y1="510" x2="390" y2="460"/>
      <!-- Top Tube -->
      <line x1="390" y1="460" x2="460" y2="430"/>
      <!-- Down Tube -->
      <line x1="390" y1="460" x2="500" y2="510"/>
      <!-- Head Tube -->
      <line x1="460" y1="430" x2="500" y2="510"/>
      
      <!-- Chainstay -->
      <line x1="310" y1="510" x2="400" y2="510"/>
      <!-- Seatstay -->
      <line x1="310" y1="510" x2="390" y2="460"/>
      
      <!-- Handlebars -->
      <path d="M460 430 Q 470 420 490 430"/>
      
      <!-- Fork -->
      <line x1="500" y1="510" x2="460" y2="430"/>
      
      <!-- Saddle -->
      <path d="M380 455 Q 390 450 400 455" stroke-width="8"/>
      
      <!-- Chain -->
      <path d="M400 510 L 310 510 L 340 480 L 370 480 Z" stroke-width="3" fill="none"/>
      <circle cx="400" cy="510" r="15" stroke-width="4"/>
    </g>

    <!-- Wheel Spokes (Decorative) -->
    <g stroke="#555" stroke-width="2" opacity="0.6">
      <g transform="translate(310 510)" class="wheel-spin">
        <line x1="0" y1="-70" x2="0" y2="70"/>
        <line x1="-70" y1="0" x2="70" y2="0"/>
        <line x1="-50" y1="-50" x2="50" y2="50"/>
        <line x1="-50" y1="50" x2="50" y2="-50"/>
      </g>
      <g transform="translate(500 510)" class="wheel-spin">
        <line x1="0" y1="-70" x2="0" y2="70"/>
        <line x1="-70" y1="0" x2="70" y2="0"/>
        <line x1="-50" y1="-50" x2="50" y2="50"/>
        <line x1="-50" y1="50" x2="50" y2="-50"/>
      </g>
    </g>

    <!-- Pedals -->
    <g class="pedal-group">
      <line x1="400" y1="510" x2="400" y2="540" stroke="#333" stroke-width="4"/>
      <rect x="385" y="540" width="30" height="8" fill="#222"/>
      <line x1="400" y1="510" x2="400" y2="480" stroke="#333" stroke-width="4"/>
      <rect x="385" y="472" width="30" height="8" fill="#222"/>
    </g>

    <!-- Pelican -->
    <g class="bird-group" transform="translate(0, -40)">
      <!-- Legs -->
      <path d="M 400 510 Q 410 470 420 450" stroke="#FF8C00" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M 400 510 Q 390 470 380 460" stroke="#FF8C00" stroke-width="8" fill="none" stroke-linecap="round"/>
      
      <!-- Body -->
      <ellipse cx="400" cy="420" rx="50" ry="40" fill="white" stroke="#ddd" stroke-width="1"/>
      
      <!-- Neck -->
      <path d="M 430 410 Q 460 380 460 350" stroke="white" stroke-width="25" fill="none" stroke-linecap="round"/>
      
      <!-- Head -->
      <circle cx="460" cy="340" r="25" fill="white"/>
      <circle cx="468" cy="335" r="4" fill="#333"/>
      
      <!-- Beak & Pouch -->
      <path d="M 480 345 Q 550 350 550 370 Q 550 400 490 385 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
      <!-- Beak Top -->
      <path d="M 480 345 Q 540 340 550 350" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
      
      <!-- Eye Detail -->
      <circle cx="468" cy="335" r="2" fill="white"/>
      
      <!-- Wing -->
      <path d="M 380 400 Q 350 420 370 450 Q 400 440 410 410 Z" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
      
      <!-- Hair/Tuft -->
      <path d="M 455 320 Q 450 310 460 300" stroke="#333" stroke-width="3" fill="none"/>
      
      <!-- Arms holding handlebars -->
      <path d="M 415 410 Q 450 400 475 425" stroke="#FF8C00" stroke-width="8" fill="none" stroke-linecap="round"/>
      
      <!-- Feet -->
      <path d="M 380 460 L 385 475" stroke="#FF8C00" stroke-width="6"/>
      <path d="M 420 450 L 415 475" stroke="#FF8C00" stroke-width="6"/>
    </g>
  </g>
</svg>
