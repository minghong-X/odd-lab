<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="一只鳄鱼骑着摩托车飞驰">
  <title>鳄鱼骑摩托车</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8f0"/>
      <stop offset="55%" stop-color="#bfe6f7"/>
      <stop offset="100%" stop-color="#ffe0ad"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c9" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ffd97a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd97a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a56"/>
      <stop offset="100%" stop-color="#26262e"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#77c65a"/>
      <stop offset="100%" stop-color="#2e7d38"/>
    </linearGradient>
    <linearGradient id="skinDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ea344"/>
      <stop offset="100%" stop-color="#256b2e"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="100%" stop-color="#c8200f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff8d0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fff8d0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="800" height="450" fill="url(#sky)"/>
  <circle cx="640" cy="105" r="120" fill="url(#sunGlow)"/>
  <circle cx="640" cy="105" r="42" fill="#fff3b0"/>

  <!-- 远山（向左滚动） -->
  <g opacity="0.55">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-800 0" dur="14s" repeatCount="indefinite"/>
      <path d="M0 330 L90 250 L170 330 Z" fill="#6fae8f"/>
      <path d="M120 330 L230 220 L340 330 Z" fill="#5c9c7d"/>
      <path d="M300 330 L400 255 L500 330 Z" fill="#6fae8f"/>
      <path d="M460 330 L580 210 L700 330 Z" fill="#5c9c7d"/>
      <path d="M660 330 L750 258 L840 330 Z" fill="#6fae8f"/>
      <path d="M800 330 L890 250 L970 330 Z" fill="#6fae8f"/>
      <path d="M920 330 L1030 220 L1140 330 Z" fill="#5c9c7d"/>
      <path d="M1100 330 L1200 255 L1300 330 Z" fill="#6fae8f"/>
      <path d="M1260 330 L1380 210 L1500 330 Z" fill="#5c9c7d"/>
      <path d="M1460 330 L1550 258 L1640 330 Z" fill="#6fae8f"/>
    </g>
  </g>

  <!-- 云（向左滚动） -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-800 0" dur="9s" repeatCount="indefinite"/>
      <g>
        <ellipse cx="120" cy="88" rx="46" ry="20"/>
        <ellipse cx="155" cy="76" rx="34" ry="22"/>
        <ellipse cx="92" cy="78" rx="26" ry="16"/>
      </g>
      <g>
        <ellipse cx="430" cy="140" rx="52" ry="18"/>
        <ellipse cx="465" cy="128" rx="32" ry="20"/>
      </g>
      <g>
        <ellipse cx="720" cy="60" rx="40" ry="16"/>
        <ellipse cx="748" cy="50" rx="26" ry="16"/>
      </g>
      <g>
        <ellipse cx="920" cy="88" rx="46" ry="20"/>
        <ellipse cx="955" cy="76" rx="34" ry="22"/>
        <ellipse cx="892" cy="78" rx="26" ry="16"/>
      </g>
      <g>
        <ellipse cx="1230" cy="140" rx="52" ry="18"/>
        <ellipse cx="1265" cy="128" rx="32" ry="20"/>
      </g>
      <g>
        <ellipse cx="1520" cy="60" rx="40" ry="16"/>
        <ellipse cx="1548" cy="50" rx="26" ry="16"/>
      </g>
    </g>
  </g>

  <!-- 地面与公路 -->
  <rect x="0" y="326" width="800" height="30" fill="#8bc48a"/>
  <rect x="0" y="352" width="800" height="98" fill="url(#road)"/>
  <rect x="0" y="352" width="800" height="6" fill="#5f5f6e"/>

  <line x1="0" y1="404" x2="800" y2="404" stroke="#f6e7a8" stroke-width="9" stroke-dasharray="64 48">
    <animate attributeName="stroke-dashoffset" values="0;112" dur="0.36s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="366" x2="800" y2="366" stroke="#ffffff" stroke-width="4" stroke-opacity="0.5" stroke-dasharray="30 40">
    <animate attributeName="stroke-dashoffset" values="0;70" dur="0.3s" repeatCount="indefinite"/>
  </line>

  <!-- 车灯束 -->
  <polygon points="512,272 800,208 800,340" fill="url(#beam)" opacity="0.35">
    <animate attributeName="opacity" values="0.22;0.42;0.22" dur="1.6s" repeatCount="indefinite"/>
  </polygon>

  <!-- 尾气 -->
  <g fill="#e9eef2" opacity="0.75">
    <circle cx="324" cy="338" r="6">
      <animate attributeName="cx" values="324;234;178" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="338;314;294" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;15;24" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0.4;0" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="324" cy="338" r="6">
      <animate attributeName="cx" values="324;244;188" dur="1.1s" begin="0.36s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="338;320;304" dur="1.1s" begin="0.36s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;14;22" dur="1.1s" begin="0.36s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.35;0" dur="1.1s" begin="0.36s" repeatCount="indefinite"/>
    </circle>
    <circle cx="324" cy="338" r="6">
      <animate attributeName="cx" values="324;228;168" dur="1.1s" begin="0.72s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="338;308;286" dur="1.1s" begin="0.72s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;16;26" dur="1.1s" begin="0.72s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.35;0" dur="1.1s" begin="0.72s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 影子 -->
  <ellipse cx="400" cy="392" rx="180" ry="14" fill="#101018" opacity="0.28">
    <animate attributeName="rx" values="180;172;180" dur="0.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 主体：鳄鱼 + 摩托车（轻微颠簸） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0;0 2;0 0" dur="0.5s" repeatCount="indefinite"/>

    <!-- 鳄鱼尾巴（车后） -->
    <g>
      <path d="M330 262 C296 256 262 244 232 218 C222 208 228 196 240 202 C270 214 302 236 336 246 Z" fill="url(#skinDark)"/>
      <path d="M244 206 L252 196 L262 213 L272 204 L282 224 L294 214 L304 235 L316 226 L326 246" fill="none" stroke="#23662c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
        <animate attributeName="d" dur="1.4s" repeatCount="indefinite"
          values="M244 206 L252 196 L262 213 L272 204 L282 224 L294 214 L304 235 L316 226 L326 246;
                  M244 203 L252 193 L262 210 L272 201 L282 221 L294 211 L304 232 L316 223 L326 243;
                  M244 206 L252 196 L262 213 L272 204 L282 224 L294 214 L304 235 L316 226 L326 246"/>
      </path>
      <path d="M300 252 C320 258 336 262 348 264" stroke="#23662c" stroke-width="4" fill="none" opacity="0.6"/>
    </g>

    <!-- 后轮 -->
    <g>
      <circle cx="272" cy="336" r="52" fill="#1d1d24"/>
      <circle cx="272" cy="336" r="52" fill="none" stroke="#0e0e13" stroke-width="6"/>
      <circle cx="272" cy="336" r="34" fill="#c9cdd6"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 272 336;360 272 336" dur="0.42s" repeatCount="indefinite"/>
        <g stroke="#7d838f" stroke-width="5" stroke-linecap="round">
          <line x1="272" y1="304" x2="272" y2="368"/>
          <line x1="240" y1="336" x2="304" y2="336"/>
          <line x1="249" y1="313" x2="295" y2="359"/>
          <line x1="295" y1="313" x2="249" y2="359"/>
        </g>
        <circle cx="272" cy="336" r="9" fill="#f2b23e"/>
      </g>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="520" cy="336" r="52" fill="#1d1d24"/>
      <circle cx="520" cy="336" r="52" fill="none" stroke="#0e0e13" stroke-width="6"/>
      <circle cx="520" cy="336" r="34" fill="#c9cdd6"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 520 336;360 520 336" dur="0.42s" repeatCount="indefinite"/>
        <g stroke="#7d838f" stroke-width="5" stroke-linecap="round">
          <line x1="520" y1="304" x2="520" y2="368"/>
          <line x1="488" y1="336" x2="552" y2="336"/>
          <line x1="497" y1="313" x2="543" y2="359"/>
          <line x1="543" y1="313" x2="497" y2="359"/>
        </g>
        <circle cx="520" cy="336" r="9" fill="#f2b23e"/>
      </g>
    </g>

    <!-- 车架、摇臂、发动机 -->
    <path d="M272 336 L352 296" stroke="#3a3a45" stroke-width="14" stroke-linecap="round"/>
    <path d="M520 336 L474 258" stroke="#3a3a45" stroke-width="12" stroke-linecap="round"/>
    <rect x="348" y="286" width="92" height="54" rx="14" fill="#5a5f6b"/>
    <rect x="356" y="294" width="76" height="12" rx="6" fill="#8b919e"/>
    <rect x="356" y="312" width="76" height="10" rx="5" fill="#8b919e"/>
    <circle cx="392" cy="332" r="10" fill="#2f333c"/>

    <!-- 排气管 -->
    <path d="M436 328 C414 342 374 344 348 340" stroke="#9aa0ab" stroke-width="11" fill="none" stroke-linecap="round"/>
    <ellipse cx="338" cy="340" rx="14" ry="9" fill="#8b919e"/>
    <ellipse cx="328" cy="340" rx="5" ry="5" fill="#2b2b33"/>

    <!-- 车身：座垫 + 油箱 + 整流罩 -->
    <path d="M300 282 C324 262 372 258 412 262 C444 265 470 272 486 282 C470 300 436 306 404 304 C368 302 328 298 300 282 Z" fill="url(#tank)"/>
    <path d="M316 278 C344 264 384 262 416 266 C442 269 462 275 476 282" stroke="#ffd9c9" stroke-width="5" fill="none" opacity="0.55"/>
    <path d="M306 272 C330 254 360 250 384 252 L382 264 C358 262 334 268 318 280 Z" fill="#2b2b33"/>
    <path d="M486 282 C500 274 512 270 520 268 L528 284 C516 288 504 294 496 300 Z" fill="#2b2b33"/>

    <!-- 前挡泥板 + 车头灯 -->
    <path d="M478 300 C492 278 520 268 546 276 C556 279 558 292 548 294 C528 290 508 296 496 312 Z" fill="#c8200f"/>
    <circle cx="498" cy="270" r="17" fill="#ffe9a8" stroke="#2b2b33" stroke-width="4"/>
    <circle cx="498" cy="270" r="8" fill="#fffdf0">
      <animate attributeName="opacity" values="1;0.6;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- 车把 -->
    <path d="M474 258 L462 240 L436 244" stroke="#2b2b33" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="424" y="238" width="22" height="13" rx="6" fill="#111116"/>

    <!-- 鳄鱼后腿（踩脚踏） -->
    <path d="M336 258 C352 268 366 284 372 300 L392 312 C400 318 394 330 384 326 L360 314 C346 302 332 284 326 270 Z" fill="url(#skinDark)"/>
    <path d="M380 310 L398 318 C404 321 402 331 394 330 L374 324 Z" fill="#2e7d38"/>
    <path d="M392 328 L398 336 M384 328 L388 337" stroke="#1f5a27" stroke-width="3" stroke-linecap="round"/>

    <!-- 鳄鱼身体 -->
    <path d="M318 266 C316 236 344 214 378 214 C410 214 434 226 444 242 C452 256 448 272 434 278 C410 288 366 290 342 284 C326 280 318 276 318 266 Z" fill="url(#skin)"/>
    <path d="M344 282 C372 288 412 286 432 276 C424 268 396 264 372 266 C354 268 344 274 344 282 Z" fill="#d8ecaa" opacity="0.95"/>
    <path d="M352 276 L360 284 M372 274 L380 284 M392 274 L400 283 M412 274 L418 281" stroke="#b9d489" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 背脊鳞甲 -->
    <path d="M322 258 L330 240 L342 254 L352 232 L366 248 L378 226 L392 244 L404 224 L416 244 L428 232 L436 250" fill="none" stroke="#23662c" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 鳄鱼前臂（握把） -->
    <path d="M404 232 C420 240 434 244 446 246 L448 260 C432 260 412 254 398 246 Z" fill="url(#skinDark)"/>
    <path d="M436 242 C448 240 458 244 458 250 C458 258 448 262 438 260 Z" fill="#2e7d38"/>
    <path d="M442 258 L444 266 M450 256 L453 264" stroke="#1f5a27" stroke-width="3" stroke-linecap="round"/>

    <!-- 鳄鱼头部 -->
    <g>
      <!-- 上颚与吻部 -->
      <path d="M386 230 C384 208 402 194 424 194 C442 194 452 200 466 202 L508 208 C518 210 518 220 508 221 L452 224 C442 232 422 238 404 238 C394 238 387 236 386 230 Z" fill="url(#skin)"/>
      <ellipse cx="502" cy="211" rx="4" ry="3" fill="#1c4d24"/>
      <!-- 眼睛 -->
      <circle cx="424" cy="204" r="13" fill="#8fd36a"/>
      <circle cx="426" cy="204" r="8" fill="#fffbe8"/>
      <circle cx="429" cy="204" r="4.5" fill="#14140f">
        <animate attributeName="cx" values="429;431;429;427;429" dur="3s" repeatCount="indefinite"/>
      </circle>
      <path d="M412 194 C418 188 432 188 438 194" stroke="#23662c" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- 下颚（张合） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 402 234;7 402 234;0 402 234;3 402 234;0 402 234" dur="1.3s" repeatCount="indefinite"/>
        <path d="M402 234 L504 222 C513 222 514 232 505 233 L410 244 C403 245 399 240 402 234 Z" fill="#5fae4c"/>
        <path d="M410 236 L500 226" stroke="#c46a6a" stroke-width="4" opacity="0.55"/>
        <g fill="#fffef2">
          <path d="M420 232 L425 240 L430 231 Z"/>
          <path d="M444 229 L449 237 L454 228 Z"/>
          <path d="M468 226 L473 234 L478 225 Z"/>
          <path d="M490 224 L494 231 L498 223 Z"/>
        </g>
      </g>
      <!-- 上颚牙齿 -->
      <g fill="#fffef2">
        <path d="M444 224 L449 233 L454 224 Z"/>
        <path d="M466 222 L471 231 L476 222 Z"/>
        <path d="M488 220 L492 228 L496 220 Z"/>
      </g>
    </g>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.85">
    <line x1="0" y1="200" x2="90" y2="200" stroke-width="5">
      <animate attributeName="x1" values="820;-140" dur="0.55s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="910;-50" dur="0.55s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="160" x2="60" y2="160" stroke-width="4">
      <animate attributeName="x1" values="860;-100" dur="0.7s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="920;-40" dur="0.7s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="0.7s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="252" x2="120" y2="252" stroke-width="6">
      <animate attributeName="x1" values="840;-180" dur="0.45s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="960;-60" dur="0.45s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="0.45s" begin="0.1s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="316" x2="70" y2="316" stroke-width="4">
      <animate attributeName="x1" values="800;-120" dur="0.6s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="870;-50" dur="0.6s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="0.6s" begin="0.35s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
