<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      @keyframes ride {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        25% { transform: translateY(-6px) rotate(-1deg); }
        50% { transform: translateY(0px) rotate(0deg); }
        75% { transform: translateY(-4px) rotate(0.5deg); }
      }
      @keyframes wheelSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes tailWag {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(8deg); }
        70% { transform: rotate(-5deg); }
      }
      @keyframes jawMove {
        0%, 70%, 100% { transform: rotate(0deg); }
        80% { transform: rotate(8deg); }
        90% { transform: rotate(0deg); }
      }
      @keyframes exhaust {
        0% { opacity: 0.8; transform: translate(0,0) scale(1); }
        100% { opacity: 0; transform: translate(-60, -20) scale(2.5); }
      }
      @keyframes bgScroll {
        from { transform: translateX(0); }
        to { transform: translateX(-200px); }
      }
      @keyframes eyeBlink {
        0%, 90%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
      }
      @keyframes scarf {
        0%, 100% { d: path("M 420,195 Q 390,190 370,200 Q 350,210 330,205 Q 310,198 295,210"); }
        50% { d: path("M 420,195 Q 388,185 365,195 Q 345,215 325,210 Q 305,200 288,215"); }
      }
      .ride-group { animation: ride 0.4s ease-in-out infinite; }
      .wheel-spin { animation: wheelSpin 0.5s linear infinite; }
      .tail-wag { animation: tailWag 1.2s ease-in-out infinite; transform-origin: 280px 220px; }
      .jaw-move { animation: jawMove 3s ease-in-out infinite; transform-origin: 500px 210px; }
      .eye-blink { animation: eyeBlink 4s ease-in-out infinite; transform-origin: 478px 185px; }
      .bg-scroll { animation: bgScroll 3s linear infinite; }
    </style>
    <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="70%" stop-color="#333"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a8c3f"/>
      <stop offset="100%" stop-color="#2d6b25"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e6a0"/>
      <stop offset="100%" stop-color="#a0cc78"/>
    </linearGradient>
    <linearGradient id="motorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cc2222"/>
      <stop offset="50%" stop-color="#aa1111"/>
      <stop offset="100%" stop-color="#881010"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eee"/>
      <stop offset="50%" stop-color="#ccc"/>
      <stop offset="100%" stop-color="#999"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F0FF"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="680" cy="80" r="50" fill="#FFD93D" opacity="0.9">
    <animate attributeName="r" values="50;54;50" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="80" r="60" fill="#FFD93D" opacity="0.2">
    <animate attributeName="r" values="60;68;60" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Clouds scrolling -->
  <g class="bg-scroll">
    <ellipse cx="150" cy="90" rx="60" ry="25" fill="white" opacity="0.8"/>
    <ellipse cx="180" cy="80" rx="45" ry="20" fill="white" opacity="0.9"/>
    <ellipse cx="120" cy="85" rx="35" ry="18" fill="white" opacity="0.7"/>
    <ellipse cx="450" cy="60" rx="50" ry="20" fill="white" opacity="0.7"/>
    <ellipse cx="480" cy="52" rx="40" ry="16" fill="white" opacity="0.8"/>
    <ellipse cx="850" cy="90" rx="60" ry="25" fill="white" opacity="0.8"/>
    <ellipse cx="880" cy="80" rx="45" ry="20" fill="white" opacity="0.9"/>
    <ellipse cx="1050" cy="60" rx="50" ry="20" fill="white" opacity="0.7"/>
    <ellipse cx="1080" cy="52" rx="40" ry="16" fill="white" opacity="0.8"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="420" width="800" height="80" fill="#888"/>
  <rect x="0" y="420" width="800" height="8" fill="#666"/>
  <!-- Road markings scrolling -->
  <g class="bg-scroll">
    <rect x="50" y="455" width="60" height="6" rx="3" fill="#FFD700" opacity="0.8"/>
    <rect x="200" y="455" width="60" height="6" rx="3" fill="#FFD700" opacity="0.8"/>
    <rect x="350" y="455" width="60" height="6" rx="3" fill="#FFD700" opacity="0.8"/>
    <rect x="500" y="455" width="60" height="6" rx="3" fill="#FFD700" opacity="0.8"/>
    <rect x="650" y="455" width="60" height="6" rx="3" fill="#FFD700" opacity="0.8"/>
    <rect x="800" y="455" width="60" height="6" rx="3" fill="#FFD700" opacity="0.8"/>
    <rect x="950" y="455" width="60" height="6" rx="3" fill="#FFD700" opacity="0.8"/>
  </g>

  <!-- Main ride group - bounces -->
  <g class="ride-group">

    <!-- === MOTORCYCLE === -->

    <!-- Exhaust smoke -->
    <g>
      <circle cx="240" cy="350" r="8" fill="#ccc" opacity="0">
        <animate attributeName="cx" values="240;190;150" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="350;335;315" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;12;20" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.3;0" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="240" cy="350" r="6" fill="#bbb" opacity="0">
        <animate attributeName="cx" values="240;195;160" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="350;330;305" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4;10;18" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.25;0" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="240" cy="350" r="7" fill="#ddd" opacity="0">
        <animate attributeName="cx" values="240;185;140" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="348;328;300" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4;14;22" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.2;0" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Rear wheel -->
    <g transform="translate(290, 390)">
      <g class="wheel-spin" style="transform-origin: 0px 0px;">
        <circle cx="0" cy="0" r="45" fill="url(#wheelGrad)" stroke="#222" stroke-width="3"/>
        <circle cx="0" cy="0" r="38" fill="none" stroke="#444" stroke-width="2"/>
        <circle cx="0" cy="0" r="10" fill="#888" stroke="#666" stroke-width="2"/>
        <!-- Spokes -->
        <line x1="0" y1="-10" x2="0" y2="-38" stroke="#777" stroke-width="2"/>
        <line x1="0" y1="10" x2="0" y2="38" stroke="#777" stroke-width="2"/>
        <line x1="-10" y1="0" x2="-38" y2="0" stroke="#777" stroke-width="2"/>
        <line x1="10" y1="0" x2="38" y2="0" stroke="#777" stroke-width="2"/>
        <line x1="-7" y1="-7" x2="-27" y2="-27" stroke="#777" stroke-width="1.5"/>
        <line x1="7" y1="7" x2="27" y2="27" stroke="#777" stroke-width="1.5"/>
        <line x1="7" y1="-7" x2="27" y2="-27" stroke="#777" stroke-width="1.5"/>
        <line x1="-7" y1="7" x2="-27" y2="27" stroke="#777" stroke-width="1.5"/>
      </g>
      <!-- Tire tread -->
      <circle cx="0" cy="0" r="45" fill="none" stroke="#222" stroke-width="6"/>
    </g>

    <!-- Front wheel -->
    <g transform="translate(530, 390)">
      <g class="wheel-spin" style="transform-origin: 0px 0px;">
        <circle cx="0" cy="0" r="45" fill="url(#wheelGrad)" stroke="#222" stroke-width="3"/>
        <circle cx="0" cy="0" r="38" fill="none" stroke="#444" stroke-width="2"/>
        <circle cx="0" cy="0" r="10" fill="#888" stroke="#666" stroke-width="2"/>
        <line x1="0" y1="-10" x2="0" y2="-38" stroke="#777" stroke-width="2"/>
        <line x1="0" y1="10" x2="0" y2="38" stroke="#777" stroke-width="2"/>
        <line x1="-10" y1="0" x2="-38" y2="0" stroke="#777" stroke-width="2"/>
        <line x1="10" y1="0" x2="38" y2="0" stroke="#777" stroke-width="2"/>
        <line x1="-7" y1="-7" x2="-27" y2="-27" stroke="#777" stroke-width="1.5"/>
        <line x1="7" y1="7" x2="27" y2="27" stroke="#777" stroke-width="1.5"/>
        <line x1="7" y1="-7" x2="27" y2="-27" stroke="#777" stroke-width="1.5"/>
        <line x1="-7" y1="7" x2="-27" y2="27" stroke="#777" stroke-width="1.5"/>
      </g>
      <circle cx="0" cy="0" r="45" fill="none" stroke="#222" stroke-width="6"/>
    </g>

    <!-- Motorcycle frame -->
    <!-- Engine block -->
    <rect x="340" y="340" width="80" height="45" rx="8" fill="#444" stroke="#333" stroke-width="2"/>
    <rect x="345" y="345" width="30" height="15" rx="3" fill="#555"/>
    <rect x="345" y="365" width="30" height="15" rx="3" fill="#555"/>
    <!-- Exhaust pipe -->
    <path d="M 340,365 Q 310,370 280,360 Q 255,352 245,355" fill="none" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 340,365 Q 310,370 280,360 Q 255,352 245,355" fill="none" stroke="#bbb" stroke-width="4" stroke-linecap="round"/>

    <!-- Main body/tank -->
    <path d="M 290,340 Q 310,290 380,280 Q 430,275 460,290 L 470,330 Q 440,345 380,350 Q 330,355 290,340 Z" fill="url(#motorGrad)" stroke="#881010" stroke-width="2"/>
    <!-- Tank highlight -->
    <path d="M 340,295 Q 370,285 400,290" fill="none" stroke="#ff4444" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

    <!-- Seat -->
    <path d="M 330,280 Q 370,265 420,268 Q 440,270 445,278 L 440,285 Q 400,278 350,282 Z" fill="#222" stroke="#111" stroke-width="1.5"/>

    <!-- Rear fender -->
    <path d="M 260,355 Q 275,330 310,340 L 310,360 Q 280,365 260,355 Z" fill="url(#motorGrad)" stroke="#881010" stroke-width="1.5"/>

    <!-- Front fork -->
    <line x1="475" y1="300" x2="530" y2="350" stroke="url(#chromeGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="478" y1="298" x2="533" y2="348" stroke="#bbb" stroke-width="4" stroke-linecap="round"/>
    <!-- Fork lower -->
    <line x1="525" y1="345" x2="530" y2="390" stroke="url(#chromeGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Front fender -->
    <path d="M 500,370 Q 530,345 560,370" fill="none" stroke="url(#motorGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Headlight -->
    <ellipse cx="555" cy="330" rx="15" ry="12" fill="#FFE066" stroke="#ccc" stroke-width="2"/>
    <ellipse cx="555" cy="330" rx="10" ry="8" fill="#FFF8DC"/>
    <!-- Headlight beam -->
    <path d="M 570,330 L 620,315 L 620,345 Z" fill="#FFE066" opacity="0.2"/>

    <!-- Handlebar -->
    <line x1="460" y1="275" x2="490" y2="260" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="490" y1="260" x2="510" y2="255" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    <!-- Grip -->
    <rect x="505" y="250" width="18" height="10" rx="4" fill="#333"/>

    <!-- Rear frame struts -->
    <line x1="310" y1="340" x2="290" y2="390" stroke="#666" stroke-width="5" stroke-linecap="round"/>
    <!-- Chain area -->
    <line x1="350" y1="370" x2="290" y2="390" stroke="#444" stroke-width="3"/>

    <!-- Foot peg -->
    <rect x="365" y="372" width="25" height="6" rx="3" fill="#888" stroke="#666" stroke-width="1"/>

    <!-- === CROCODILE === -->

    <!-- Tail -->
    <g class="tail-wag">
      <path d="M 310,230 Q 270,225 240,235 Q 200,250 170,240 Q 140,228 120,240 Q 105,248 95,242" fill="url(#bodyGrad)" stroke="#2d6b25" stroke-width="2"/>
      <!-- Tail ridges -->
      <path d="M 280,228 L 275,218 L 270,228" fill="#3a7a30" stroke="#2d6b25" stroke-width="1"/>
      <path d="M 250,232 L 245,222 L 240,233" fill="#3a7a30" stroke="#2d6b25" stroke-width="1"/>
      <path d="M 220,238 L 215,228 L 210,239" fill="#3a7a30" stroke="#2d6b25" stroke-width="1"/>
      <path d="M 190,242 L 186,233 L 182,243" fill="#3a7a30" stroke="#2d6b25" stroke-width="1"/>
      <path d="M 160,237 L 157,228 L 153,238" fill="#3a7a30" stroke="#2d6b25" stroke-width="1"/>
      <path d="M 135,234 L 132,225 L 128,235" fill="#3a7a30" stroke="#2d6b25" stroke-width="1"/>
    </g>

    <!-- Body -->
    <ellipse cx="390" cy="230" rx="90" ry="45" fill="url(#bodyGrad)" stroke="#2d6b25" stroke-width="2"/>
    <!-- Belly -->
    <ellipse cx="390" cy="245" rx="70" ry="25" fill="url(#bellyGrad)" opacity="0.7"/>
    <!-- Back ridges -->
    <path d="M 340,190 L 335,178 L 330,190" fill="#3a7a30" stroke="#2d6b25" stroke-width="1"/>
    <path d="M 360,187 L 355,174 L 350,187" fill="#3a7a30" stroke="#2d6b25" stroke-width="1"/>
    <path d="M 380,186 L 375,172 L 370,186" fill="#3a7a30" stroke="#2d6b25" stroke-width="1"/>
    <path d="M 400,187 L 395,174 L 390,187" fill="#3a7a30" stroke="#2d6b25" stroke-width="1"/>
    <path d="M 420,190 L 415,178 L 410,190" fill="#3a7a30" stroke="#2d6b25" stroke-width="1"/>

    <!-- Scarf / bandana blowing in wind -->
    <path d="M 430,200 Q 410,195 390,202 Q 370,212 350,208 Q 330,200 310,215" fill="none" stroke="#E63946" stroke-width="6" stroke-linecap="round" opacity="0.9">
      <animate attributeName="d" values="M 430,200 Q 410,195 390,202 Q 370,212 350,208 Q 330,200 310,215;M 430,200 Q 408,190 385,198 Q 362,216 342,212 Q 322,202 305,220;M 430,200 Q 410,195 390,202 Q 370,212 350,208 Q 330,200 310,215" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 430,204 Q 410,199 390,206 Q 370,216 350,212 Q 330,204 310,219" fill="none" stroke="#C1121F" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <animate attributeName="d" values="M 430,204 Q 410,199 390,206 Q 370,216 350,212 Q 330,204 310,219;M 430,204 Q 408,194 385,202 Q 362,220 342,216 Q 322,206 305,224;M 430,204 Q 410,199 390,206 Q 370,216 350,212 Q 330,204 310,219" dur="1.5s" repeatCount="indefinite"/>
    </path>

    <!-- Head -->
    <path d="M 450,220 Q 480,195 520,190 Q 550,188 570,200 Q 575,215 560,225 Q 530,240 490,240 Q 460,238 450,230 Z" fill="url(#bodyGrad)" stroke="#2d6b25" stroke-width="2"/>

    <!-- Snout / Upper jaw -->
    <path d="M 540,200 Q 570,195 600,200 Q 620,205 625,215 Q 615,220 590,218 Q 560,215 540,210 Z" fill="#3d8235" stroke="#2d6b25" stroke-width="1.5"/>
    <!-- Nostril -->
    <ellipse cx="615" cy="205" rx="4" ry="3" fill="#1a4a15"/>

    <!-- Lower jaw -->
    <g class="jaw-move">
      <path d="M 540,220 Q 570,225 600,222 Q 620,218 625,215 Q 622,225 600,230 Q 570,235 540,228 Z" fill="#3d8235" stroke="#2d6b25" stroke-width="1.5"/>
      <!-- Teeth bottom -->
      <path d="M 555,222 L 558,228 L 561,222" fill="white" stroke="#ddd" stroke-width="0.5"/>
      <path d="M 572,221 L 575,228 L 578,221" fill="white" stroke="#ddd" stroke-width="0.5"/>
      <path d="M 590,220 L 593,227 L 596,220" fill="white" stroke="#ddd" stroke-width="0.5"/>
      <path d="M 607,218 L 610,225 L 613,218" fill="white" stroke="#ddd" stroke-width="0.5"/>
    </g>

    <!-- Teeth top -->
    <path d="M 560,212 L 563,218 L 566,212" fill="white" stroke="#ddd" stroke-width="0.5"/>
    <path d="M 577,210 L 580,217 L 583,210" fill="white" stroke="#ddd" stroke-width="0.5"/>
    <path d="M 594,210 L 597,217 L 600,210" fill="white" stroke="#ddd" stroke-width="0.5"/>
    <path d="M 610,212 L 613,218 L 616,212" fill="white" stroke="#ddd" stroke-width="0.5"/>

    <!-- Eye bump -->
    <ellipse cx="495" cy="192" rx="16" ry="14" fill="#4a8c3f" stroke="#2d6b25" stroke-width="1.5"/>
    <!-- Eye -->
    <g class="eye-blink" style="transform-origin: 495px 190px;">
      <ellipse cx="495" cy="190" rx="10" ry="10" fill="#FFFDE7"/>
      <ellipse cx="498" cy="190" rx="5" ry="7" fill="#2E1503"/>
      <ellipse cx="499" cy="188" rx="2" ry="2" fill="white"/>
    </g>

    <!-- Arm holding handlebar -->
    <!-- Upper arm -->
    <path d="M 445,250 Q 460,265 475,268 Q 490,270 505,260" fill="url(#bodyGrad)" stroke="#2d6b25" stroke-width="2.5"/>
    <!-- Lower arm / hand on grip -->
    <path d="M 500,260 Q 505,258 510,256 Q 514,254 516,256" fill="url(#bodyGrad)" stroke="#2d6b25" stroke-width="2"/>
    <!-- Fingers gripping -->
    <path d="M 512,254 Q 515,252 514,258" fill="#3d8235" stroke="#2d6b25" stroke-width="1.5"/>
    <path d="M 516,256 Q 518,254 517,260" fill="#3d8235" stroke="#2d6b25" stroke-width="1.5"/>

    <!-- Leg on footpeg -->
    <!-- Upper leg -->
    <path d="M 380,260 Q 375,290 378,310 Q 380,325 375,340" fill="url(#bodyGrad)" stroke="#2d6b25" stroke-width="2.5"/>
    <!-- Lower leg / foot -->
    <path d="M 375,340 Q 372,355 375,368 Q 378,375 390,378" fill="url(#bodyGrad)" stroke="#2d6b25" stroke-width="2.5"/>
    <!-- Toes -->
    <circle cx="392" cy="376" r="3" fill="#3d8235" stroke="#2d6b25" stroke-width="1"/>
    <circle cx="396" cy="378" r="3" fill="#3d8235" stroke="#2d6b25" stroke-width="1"/>

    <!-- Speed lines -->
    <line x1="80" y1="280" x2="40" y2="280" stroke="#aaa" stroke-width="2" opacity="0.4">
      <animate attributeName="opacity" values="0;0.6;0" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="90" y1="310" x2="30" y2="310" stroke="#aaa" stroke-width="2" opacity="0.3">
      <animate attributeName="opacity" values="0;0.5;0" dur="1s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="260" x2="50" y2="260" stroke="#aaa" stroke-width="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0;0.4;0" dur="0.7s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="85" y1="340" x2="45" y2="340" stroke="#aaa" stroke-width="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0;0.5;0" dur="0.9s" begin="0.1s" repeatCount="indefinite"/>
    </line>

  </g>
</svg>