<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="一只鳄鱼骑着摩托车的 SVG 动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd3ff"/>
      <stop offset="100%" stop-color="#dff6ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c5258"/>
      <stop offset="100%" stop-color="#2e3338"/>
    </linearGradient>
    <linearGradient id="crocBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79c84a"/>
      <stop offset="100%" stop-color="#2e8c3a"/>
    </linearGradient>
    <linearGradient id="bikeRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5a4f"/>
      <stop offset="100%" stop-color="#b91f2b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#172027" flood-opacity=".28"/>
    </filter>
    <style>
      .cloud { animation: drift 18s linear infinite; }
      .cloud.two { animation-duration: 25s; animation-delay: -8s; }
      .dash { animation: roadMove 1.1s linear infinite; }
      .dash.slow { animation-duration: 1.45s; }
      .bounce { animation: bounce .72s ease-in-out infinite; transform-origin: 400px 345px; }
      .tail { animation: wag .48s ease-in-out infinite alternate; transform-origin: 222px 301px; }
      .jaw { animation: chatter .42s ease-in-out infinite alternate; transform-origin: 494px 254px; }
      .eyeLid { animation: blink 4s ease-in-out infinite; transform-origin: center; }
      .smoke { animation: puff 1.2s ease-out infinite; transform-origin: center; }
      .smoke.b { animation-delay: .35s; }
      .smoke.c { animation-delay: .7s; }
      @keyframes drift {
        from { transform: translateX(-120px); }
        to { transform: translateX(920px); }
      }
      @keyframes roadMove {
        from { transform: translateX(0); }
        to { transform: translateX(-180px); }
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @keyframes wag {
        from { transform: rotate(-5deg); }
        to { transform: rotate(7deg); }
      }
      @keyframes chatter {
        from { transform: rotate(0deg); }
        to { transform: rotate(3.5deg); }
      }
      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(.08); }
      }
      @keyframes puff {
        0% { opacity: .55; transform: translate(0,0) scale(.5); }
        100% { opacity: 0; transform: translate(-70px,-24px) scale(1.7); }
      }
    </style>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="690" cy="80" r="38" fill="#ffd45c"/>
  <g class="cloud" opacity=".75">
    <ellipse cx="70" cy="95" rx="42" ry="18" fill="#fff"/>
    <ellipse cx="105" cy="88" rx="34" ry="23" fill="#fff"/>
    <ellipse cx="140" cy="100" rx="48" ry="18" fill="#fff"/>
  </g>
  <g class="cloud two" opacity=".65">
    <ellipse cx="20" cy="155" rx="36" ry="15" fill="#fff"/>
    <ellipse cx="52" cy="147" rx="28" ry="20" fill="#fff"/>
    <ellipse cx="88" cy="158" rx="43" ry="16" fill="#fff"/>
  </g>

  <path d="M0 330 C95 305 160 315 240 298 C335 276 420 315 512 288 C610 259 690 291 800 267 L800 500 L0 500 Z" fill="#6dbb5a"/>
  <path d="M0 365 C125 341 244 356 360 336 C505 311 641 336 800 310 L800 500 L0 500 Z" fill="#4f9d52"/>
  <rect y="380" width="800" height="120" fill="url(#road)"/>
  <rect y="377" width="800" height="8" fill="#697077"/>
  <g class="dash">
    <rect x="25" y="433" width="100" height="10" rx="5" fill="#ffd45c"/>
    <rect x="205" y="433" width="100" height="10" rx="5" fill="#ffd45c"/>
    <rect x="385" y="433" width="100" height="10" rx="5" fill="#ffd45c"/>
    <rect x="565" y="433" width="100" height="10" rx="5" fill="#ffd45c"/>
    <rect x="745" y="433" width="100" height="10" rx="5" fill="#ffd45c"/>
  </g>
  <g class="dash slow" opacity=".35">
    <rect x="70" y="470" width="70" height="6" rx="3" fill="#ffffff"/>
    <rect x="260" y="470" width="70" height="6" rx="3" fill="#ffffff"/>
    <rect x="450" y="470" width="70" height="6" rx="3" fill="#ffffff"/>
    <rect x="640" y="470" width="70" height="6" rx="3" fill="#ffffff"/>
    <rect x="830" y="470" width="70" height="6" rx="3" fill="#ffffff"/>
  </g>

  <ellipse cx="398" cy="452" rx="235" ry="26" fill="#111820" opacity=".28"/>

  <g class="bounce" filter="url(#softShadow)">
    <g id="motorcycle">
      <g id="rearWheel">
        <circle cx="270" cy="405" r="58" fill="#15191d"/>
        <circle cx="270" cy="405" r="42" fill="#d9e1e8"/>
        <circle cx="270" cy="405" r="29" fill="#1f252b"/>
        <g stroke="#f6fbff" stroke-width="5" stroke-linecap="round">
          <line x1="270" y1="405" x2="270" y2="364"/>
          <line x1="270" y1="405" x2="270" y2="446"/>
          <line x1="270" y1="405" x2="229" y2="405"/>
          <line x1="270" y1="405" x2="311" y2="405"/>
          <line x1="270" y1="405" x2="241" y2="376"/>
          <line x1="270" y1="405" x2="299" y2="434"/>
          <line x1="270" y1="405" x2="299" y2="376"/>
          <line x1="270" y1="405" x2="241" y2="434"/>
          <animateTransform attributeName="transform" type="rotate" from="0 270 405" to="360 270 405" dur=".55s" repeatCount="indefinite"/>
        </g>
        <circle cx="270" cy="405" r="10" fill="#ffcf52"/>
      </g>

      <g id="frontWheel">
        <circle cx="535" cy="405" r="58" fill="#15191d"/>
        <circle cx="535" cy="405" r="42" fill="#d9e1e8"/>
        <circle cx="535" cy="405" r="29" fill="#1f252b"/>
        <g stroke="#f6fbff" stroke-width="5" stroke-linecap="round">
          <line x1="535" y1="405" x2="535" y2="364"/>
          <line x1="535" y1="405" x2="535" y2="446"/>
          <line x1="535" y1="405" x2="494" y2="405"/>
          <line x1="535" y1="405" x2="576" y2="405"/>
          <line x1="535" y1="405" x2="506" y2="376"/>
          <line x1="535" y1="405" x2="564" y2="434"/>
          <line x1="535" y1="405" x2="564" y2="376"/>
          <line x1="535" y1="405" x2="506" y2="434"/>
          <animateTransform attributeName="transform" type="rotate" from="0 535 405" to="360 535 405" dur=".55s" repeatCount="indefinite"/>
        </g>
        <circle cx="535" cy="405" r="10" fill="#ffcf52"/>
      </g>

      <path d="M284 397 L352 318 L452 318 L527 397" fill="none" stroke="#232b31" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M352 318 L404 397 L452 318" fill="none" stroke="#232b31" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M322 322 C356 295 425 292 470 316 C452 346 365 351 322 322 Z" fill="url(#bikeRed)" stroke="#8b1620" stroke-width="4"/>
      <rect x="322" y="285" width="88" height="20" rx="10" fill="#2a3138"/>
      <path d="M490 310 L539 256" fill="none" stroke="#232b31" stroke-width="10" stroke-linecap="round"/>
      <path d="M539 256 C567 249 590 254 605 269" fill="none" stroke="#232b31" stroke-width="9" stroke-linecap="round"/>
      <circle cx="607" cy="270" r="9" fill="#232b31"/>
      <path d="M255 394 C230 383 213 368 207 349" fill="none" stroke="#232b31" stroke-width="12" stroke-linecap="round"/>
      <path d="M205 349 L162 339" fill="none" stroke="#232b31" stroke-width="9" stroke-linecap="round"/>
      <rect x="145" y="329" width="50" height="18" rx="9" fill="#383f46"/>
      <circle cx="594" cy="290" r="17" fill="#ffe173"/>
      <path d="M608 286 C630 286 646 294 657 308" fill="none" stroke="#ffe173" stroke-width="10" stroke-linecap="round" opacity=".45"/>
      <path d="M181 348 C153 345 132 352 116 368" fill="none" stroke="#88929a" stroke-width="9" stroke-linecap="round"/>
      <circle class="smoke" cx="116" cy="368" r="10" fill="#d8e0e6"/>
      <circle class="smoke b" cx="122" cy="363" r="8" fill="#d8e0e6"/>
      <circle class="smoke c" cx="128" cy="371" r="7" fill="#d8e0e6"/>
    </g>

    <g id="crocodile">
      <g class="tail">
        <path d="M247 301 C198 291 160 266 126 224 C152 226 209 244 268 281 Z" fill="url(#crocBody)" stroke="#1f6f31" stroke-width="4" stroke-linejoin="round"/>
        <path d="M168 246 L151 218 L190 238 L171 223 L215 252 L195 228" fill="none" stroke="#1f6f31" stroke-width="4" stroke-linecap="round"/>
      </g>

      <path d="M236 281 C275 234 368 222 445 254 C480 269 490 309 463 328 C416 360 286 340 236 281 Z" fill="url(#crocBody)" stroke="#1f6f31" stroke-width="5"/>
      <path d="M258 302 C313 331 397 331 453 305" fill="none" stroke="#b8e48b" stroke-width="9" stroke-linecap="round" opacity=".8"/>

      <g fill="#1f6f31">
        <path d="M262 258 L276 230 L288 260 Z"/>
        <path d="M303 244 L318 216 L329 248 Z"/>
        <path d="M348 239 L365 213 L374 247 Z"/>
        <path d="M394 247 L412 223 L418 258 Z"/>
      </g>

      <path d="M428 252 C469 222 551 225 604 258 C585 284 506 292 449 276 Z" fill="url(#crocBody)" stroke="#1f6f31" stroke-width="5"/>
      <g class="jaw">
        <path d="M446 275 C503 289 570 282 611 260 C606 284 558 309 492 301 C468 298 452 290 446 275 Z" fill="#6fbe3f" stroke="#1f6f31" stroke-width="4"/>
        <path d="M471 282 L481 300 L491 284 L503 302 L513 286 L526 303 L536 286 L548 301 L558 282" fill="#fff"/>
      </g>
      <path d="M463 258 L475 276 L486 256 L498 279 L510 258 L522 279 L535 259 L546 276 L558 260 L568 273" fill="#fff"/>

      <ellipse cx="481" cy="238" rx="17" ry="15" fill="#f4fff1" stroke="#1f6f31" stroke-width="4"/>
      <ellipse cx="527" cy="239" rx="17" ry="15" fill="#f4fff1" stroke="#1f6f31" stroke-width="4"/>
      <circle cx="485" cy="240" r="5" fill="#171c1f"/>
      <circle cx="531" cy="241" r="5" fill="#171c1f"/>
      <rect class="eyeLid" x="465" y="226" width="36" height="25" rx="12" fill="#4aa63d" opacity=".95"/>
      <rect class="eyeLid" x="511" y="227" width="36" height="25" rx="12" fill="#4aa63d" opacity=".95"/>

      <ellipse cx="592" cy="255" rx="5" ry="3" fill="#17301e"/>
      <ellipse cx="570" cy="250" rx="4" ry="3" fill="#17301e"/>

      <path d="M367 318 C376 351 395 371 428 383" fill="none" stroke="#2f7d2f" stroke-width="18" stroke-linecap="round"/>
      <path d="M427 383 L466 396" fill="none" stroke="#2f7d2f" stroke-width="13" stroke-linecap="round"/>
      <path d="M303 312 C289 345 294 370 315 391" fill="none" stroke="#2f7d2f" stroke-width="18" stroke-linecap="round"/>
      <path d="M315 391 L356 397" fill="none" stroke="#2f7d2f" stroke-width="13" stroke-linecap="round"/>

      <path d="M425 286 C461 281 502 272 562 259" fill="none" stroke="#2f7d2f" stroke-width="16" stroke-linecap="round"/>
      <path d="M560 259 C578 257 591 262 604 270" fill="none" stroke="#2f7d2f" stroke-width="10" stroke-linecap="round"/>

      <path d="M450 220 C469 191 520 189 544 219 C527 229 470 229 450 220 Z" fill="#ef4545" stroke="#7e1822" stroke-width="4"/>
      <path d="M459 213 C479 199 517 199 535 214" fill="none" stroke="#ffb5b5" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>