<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#87CEEB"/>
  
  <!-- Sun -->
  <circle cx="350" cy="50" r="30" fill="#FFD700">
    <animate attributeName="r" values="30;32;30" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Ground -->
  <rect x="0" y="220" width="400" height="80" fill="#228B22"/>
  <line x1="0" y1="220" x2="400" y2="220" stroke="#1a6e1a" stroke-width="2"/>
  
  <!-- Bicycle Frame -->
  <g transform="translate(180, 180)">
    <!-- Wheels -->
    <circle cx="-60" cy="40" r="25" fill="none" stroke="black" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0 -60 40" to="360 -60 40" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="40" r="25" fill="none" stroke="black" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0 60 40" to="360 60 40" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Wheel Spokes -->
    <g fill="none" stroke="black" stroke-width="1">
      <line x1="-60" y1="15" x2="-60" y2="65">
        <animateTransform attributeName="transform" type="rotate" from="0 -60 40" to="360 -60 40" dur="2s" repeatCount="indefinite"/>
      </line>
      <line x1="-35" y1="40" x2="-85" y2="40">
        <animateTransform attributeName="transform" type="rotate" from="0 -60 40" to="360 -60 40" dur="2s" repeatCount="indefinite"/>
      </line>
      <line x1="60" y1="15" x2="60" y2="65">
        <animateTransform attributeName="transform" type="rotate" from="0 60 40" to="360 60 40" dur="2s" repeatCount="indefinite"/>
      </line>
      <line x1="35" y1="40" x2="85" y2="40">
        <animateTransform attributeName="transform" type="rotate" from="0 60 40" to="360 60 40" dur="2s" repeatCount="indefinite"/>
      </line>
    </g>
    
    <!-- Frame -->
    <line x1="-60" y1="40" x2="0" y2="0" stroke="black" stroke-width="4"/>
    <line x1="60" y1="40" x2="0" y2="0" stroke="black" stroke-width="4"/>
    <line x1="0" y1="0" x2="20" y2="0" stroke="black" stroke-width="4"/>
    <line x1="20" y1="0" x2="30" y2="-40" stroke="black" stroke-width="4"/>
    <line x1="-30" y1="0" x2="0" y2="0" stroke="black" stroke-width="4"/>
    <line x1="-30" y1="0" x2="-10" y2="-40" stroke="black" stroke-width="4"/>
    <line x1="-10" y1="-40" x2="30" y2="-40" stroke="black" stroke-width="4"/>
    
    <!-- Seat -->
    <ellipse cx="0" cy="-5" rx="10" ry="3" fill="brown"/>
    
    <!-- Handlebars -->
    <line x1="30" y1="-40" x2="40" y2="-45" stroke="black" stroke-width="3"/>
    <line x1="30" y1="-40" x2="20" y2="-45" stroke="black" stroke-width="3"/>
    <rect x="15" y="-50" width="30" height="5" rx="2" fill="#666"/>
    
    <!-- Pedals -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <line x1="-10" y1="10" x2="10" y2="-10" stroke="black" stroke-width="3"/>
      <rect x="-15" y="7" width="8" height="6" fill="#666" rx="1"/>
      <rect x="7" y="-13" width="8" height="6" fill="#666" rx="1"/>
    </g>
  </g>
  
  <!-- Pelican -->
  <g transform="translate(180, 130)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="30" ry="20" fill="#F5F5DC" stroke="#DEB887" stroke-width="2"/>
    
    <!-- Belly -->
    <ellipse cx="0" cy="10" rx="20" ry="10" fill="white"/>
    
    <!-- Head -->
    <ellipse cx="15" cy="-25" rx="15" ry="12" fill="#F5F5DC" stroke="#DEB887" stroke-width="2"/>
    
    <!-- Eye -->
    <circle cx="22" cy="-28" r="3" fill="black"/>
    <circle cx="23" cy="-29" r="1" fill="white"/>
    
    <!-- Beak -->
    <path d="M30,-25 L50,-20 L30,-15 Z" fill="#FF8C00" stroke="#FF6600" stroke-width="1"/>
    <path d="M30,-25 L50,-20 L30,-20 Z" fill="#FFA500"/>
    <line x1="30" y1="-20" x2="50" y2="-20" stroke="#FF6600" stroke-width="1"/>
    
    <!-- Pouch -->
    <path d="M30,-15 Q40,-10 50,-20 Q40,-25 30,-25 Z" fill="#FFD700" stroke="#FF8C00" stroke-width="1"/>
    
    <!-- Neck -->
    <path d="M15,-15 Q25,-20 15,-35" fill="none" stroke="#DEB887" stroke-width="6"/>
    <path d="M15,-15 Q25,-20 15,-35" fill="none" stroke="#F5F5DC" stroke-width="4"/>
    
    <!-- Wing -->
    <path d="M-10,-10 Q-40,-5 -20,15 Q-5,10 -10,-10" fill="#DEB887" stroke="#B8860B" stroke-width="1"/>
    <animateTransform attributeName="transform" type="rotate" values="0 0 0; 2 -10 0; 0 0 0; -2 -10 0; 0 0 0" dur="1s" repeatCount="indefinite" additive="sum"/>
    
    <!-- Tail -->
    <path d="M-30,0 L-50,10 L-40,0 Z" fill="#DEB887" stroke="#B8860B" stroke-width="1"/>
    
    <!-- Feet on pedals -->
    <line x1="5" y1="20" x2="5" y2="35" stroke="#FF8C00" stroke-width="2"/>
    <line x1="5" y1="35" x2="0" y2="38" stroke="#FF8C00" stroke-width="2"/>
    <line x1="5" y1="35" x2="10" y2="38" stroke="#FF8C00" stroke-width="2"/>
    <line x1="5" y1="35" x2="5" y2="40" stroke="#FF8C00" stroke-width="2"/>
  </g>
  
  <!-- Clouds -->
  <g fill="white">
    <ellipse cx="80" cy="60" rx="40" ry="15" opacity="0.8">
      <animate attributeName="cx" values="80;420;80" dur="20s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="120" cy="50" rx="30" ry="12" opacity="0.8">
      <animate attributeName="cx" values="120;460;120" dur="20s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="60" cy="70" rx="25" ry="10" opacity="0.8">
      <animate attributeName="cx" values="60;400;60" dur="20s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
