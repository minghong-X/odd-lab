<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">鳄鱼骑摩托车动画</title>
  <desc id="desc">一只戴着护目镜的绿色鳄鱼骑着红色摩托车飞驰，车轮旋转，道路和云朵向后移动。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#72d6ff"/>
      <stop offset="1" stop-color="#e9faff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59616b"/>
      <stop offset="1" stop-color="#262b31"/>
    </linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5b45"/>
      <stop offset="1" stop-color="#b91727"/>
    </linearGradient>
    <linearGradient id="scaleGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bd84d"/>
      <stop offset="1" stop-color="#348d3d"/>
    </linearGradient>
    <radialGradient id="chrome">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#dce8ef"/>
      <stop offset=".72" stop-color="#71808d"/>
      <stop offset="1" stop-color="#26313a"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <g id="cloud">
      <path d="M0 28c4-17 19-25 34-19 9-17 38-12 40 8 19-5 31 5 31 19H0z" fill="#fff" opacity=".88"/>
    </g>

    <g id="wheel">
      <circle r="64" fill="#151a1e"/>
      <circle r="50" fill="none" stroke="#555f68" stroke-width="8"/>
      <circle r="38" fill="#dbe7ec" stroke="#82909a" stroke-width="3"/>
      <g stroke="#39434b" stroke-width="5">
        <path d="M0-37V37"/>
        <path d="M-37 0H37"/>
        <path d="M-26-26L26 26"/>
        <path d="M26-26L-26 26"/>
      </g>
      <circle r="12" fill="url(#chrome)" stroke="#2c343a" stroke-width="3"/>
      <circle r="57" fill="none" stroke="#2b3136" stroke-width="4" stroke-dasharray="5 9"/>
    </g>

    <style>
      .bike {
        animation: bounce .34s ease-in-out infinite alternate;
        transform-origin: 500px 400px;
      }
      .wheel-spin {
        animation: spin .42s linear infinite;
      }
      .road-lines {
        animation: roadMove .55s linear infinite;
      }
      .clouds {
        animation: cloudMove 13s linear infinite;
      }
      .scarf {
        animation: scarfWave .28s ease-in-out infinite alternate;
        transform-origin: 470px 193px;
      }
      .tail {
        animation: tailWave .38s ease-in-out infinite alternate;
        transform-origin: 383px 304px;
      }
      .jaw {
        animation: jawMove 1.4s ease-in-out infinite;
        transform-origin: 620px 230px;
      }
      .head {
        animation: headBob .55s ease-in-out infinite alternate;
        transform-origin: 535px 245px;
      }
      .exhaust {
        animation: puff 1.1s ease-out infinite;
        transform-origin: 285px 386px;
      }
      .speed-line {
        animation: dash 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes bounce {
        from { transform: translateY(0) rotate(-.3deg); }
        to { transform: translateY(-5px) rotate(.5deg); }
      }
      @keyframes roadMove {
        to { transform: translateX(-180px); }
      }
      @keyframes cloudMove {
        from { transform: translateX(1000px); }
        to { transform: translateX(-1250px); }
      }
      @keyframes scarfWave {
        from { transform: rotate(7deg) scaleY(.92); }
        to { transform: rotate(-10deg) scaleY(1.08); }
      }
      @keyframes tailWave {
        from { transform: rotate(3deg); }
        to { transform: rotate(-7deg); }
      }
      @keyframes jawMove {
        0%, 55%, 100% { transform: rotate(0); }
        67%, 82% { transform: rotate(7deg); }
      }
      @keyframes headBob {
        from { transform: rotate(-1.2deg); }
        to { transform: rotate(1.5deg); }
      }
      @keyframes puff {
        0% { transform: translate(0,0) scale(.25); opacity:.75; }
        100% { transform: translate(-105px,-24px) scale(1.8); opacity:0; }
      }
      @keyframes dash {
        from { transform: translateX(0); opacity:.1; }
        30% { opacity:.75; }
        to { transform: translateX(-230px); opacity:0; }
      }
    </style>
  </defs>

  <rect width="960" height="540" fill="url(#sky)"/>
  <circle cx="800" cy="92" r="52" fill="#fff4a7" opacity=".75"/>
  <circle cx="800" cy="92" r="72" fill="#fff7bf" opacity=".22"/>

  <g class="clouds">
    <use href="#cloud" transform="translate(40 72) scale(1.05)"/>
    <use href="#cloud" transform="translate(410 105) scale(.72)"/>
    <use href="#cloud" transform="translate(790 48) scale(1.28)"/>
    <use href="#cloud" transform="translate(1160 120) scale(.9)"/>
    <use href="#cloud" transform="translate(1530 62) scale(1.18)"/>
    <use href="#cloud" transform="translate(1900 108) scale(.66)"/>
  </g>

  <path d="M0 293Q92 250 184 286T367 276T553 289T738 266T960 286V373H0z" fill="#7ecb56"/>
  <path d="M0 328Q95 294 190 321T380 309T570 324T760 304T960 317V382H0z" fill="#4f9b42"/>
  <path d="M0 355Q110 325 220 350T440 342T660 354T880 340T960 347V385H0z" fill="#34753d"/>

  <rect y="370" width="960" height="170" fill="url(#road)"/>
  <path d="M0 382H960" stroke="#eef3f4" stroke-width="7"/>
  <path d="M0 505H960" stroke="#f5c842" stroke-width="7"/>

  <g class="road-lines" stroke="#f8f1c2" stroke-width="10" stroke-linecap="round">
    <path d="M-150 455H-35M30 455H145M210 455H325M390 455H505M570 455H685M750 455H865M930 455H1045"/>
  </g>

  <ellipse cx="511" cy="467" rx="303" ry="29" fill="#111820" opacity=".4" filter="url(#shadow)"/>

  <g class="speed-line" fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M250 222H108" stroke-width="5" opacity=".52"/>
    <path d="M206 257H42" stroke-width="3" opacity=".38"/>
    <path d="M289 306H162" stroke-width="6" opacity=".34"/>
    <path d="M246 345H84" stroke-width="4" opacity=".45"/>
  </g>

  <g class="bike">
    <g transform="translate(355 421)">
      <g class="wheel-spin">
        <use href="#wheel"/>
      </g>
    </g>
    <g transform="translate(712 421)">
      <g class="wheel-spin">
        <use href="#wheel"/>
      </g>
    </g>

    <g stroke="#27323a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M355 421L450 329 566 421H355L497 421 590 331"/>
      <path d="M566 421L650 325 712 421"/>
      <path d="M650 325L678 266"/>
    </g>
    <g stroke="#b9c8d0" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M678 266L712 421"/>
      <path d="M658 274L706 260"/>
      <path d="M324 359L285 386L260 386"/>
    </g>

    <path d="M412 323Q495 275 585 319L551 365Q477 382 405 348Z" fill="url(#paint)" stroke="#671823" stroke-width="5"/>
    <path d="M489 310Q550 273 618 299Q607 344 559 359L492 352Z" fill="#e52f36" stroke="#701622" stroke-width="5"/>
    <path d="M522 316Q553 298 594 305Q584 326 558 335H522Z" fill="#ffb31f" opacity=".9"/>
    <path d="M402 319Q359 302 323 324L347 350H424Z" fill="#a81725" stroke="#671823" stroke-width="5"/>
    <rect x="411" y="291" width="122" height="25" rx="12" fill="#20282d"/>
    <rect x="439" y="287" width="82" height="9" rx="4" fill="#4d5961"/>
    <ellipse cx="534" cy="375" rx="48" ry="40" fill="url(#chrome)" stroke="#333e45" stroke-width="5"/>
    <circle cx="534" cy="375" r="18" fill="#20292f"/>
    <path d="M488 390H312" stroke="#abbac1" stroke-width="16" stroke-linecap="round"/>
    <path d="M316 390H272" stroke="#424b51" stroke-width="21" stroke-linecap="round"/>
    <path d="M605 365Q649 375 666 406" fill="none" stroke="#781923" stroke-width="12" stroke-linecap="round"/>
    <path d="M673 284Q704 275 736 289L746 320Q704 324 676 307Z" fill="#eb3441" stroke="#701622" stroke-width="5"/>
    <circle cx="742" cy="306" r="17" fill="#fff4bd" stroke="#6e3331" stroke-width="5"/>
    <path d="M749 301L788 284" stroke="#fff6c8" stroke-width="7" opacity=".55" stroke-linecap="round"/>

    <g class="exhaust">
      <circle cx="278" cy="387" r="18" fill="#d9e0e3" opacity=".65"/>
      <circle cx="257" cy="381" r="11" fill="#f1f4f5" opacity=".7"/>
      <circle cx="242" cy="392" r="15" fill="#cbd4d8" opacity=".5"/>
    </g>

    <g class="tail">
      <path d="M410 270Q333 267 278 305Q330 300 371 320Q405 337 440 305Z" fill="url(#scaleGreen)" stroke="#195c35" stroke-width="6"/>
      <path d="M301 300L322 282L331 303L350 281L362 310" fill="none" stroke="#b7e85e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <path d="M452 302Q432 343 445 383" fill="none" stroke="#4d9e3c" stroke-width="30" stroke-linecap="round"/>
    <path d="M444 383Q427 397 405 398" fill="none" stroke="#8bcf48" stroke-width="17" stroke-linecap="round"/>
    <path d="M526 294Q549 330 600 321" fill="none" stroke="#4a9a3b" stroke-width="27" stroke-linecap="round"/>
    <path d="M600 321L674 281" fill="none" stroke="#80c943" stroke-width="18" stroke-linecap="round"/>
    <circle cx="676" cy="280" r="13" fill="#a7db53" stroke="#286b37" stroke-width="4"/>
    <path d="M529 308Q572 339 620 312" fill="none" stroke="#256f39" stroke-width="4"/>

    <g class="scarf">
      <path d="M478 196Q406 176 339 211Q395 205 433 229Q390 226 351 251Q420 244 475 256Z" fill="#f23a43" stroke="#9b1725" stroke-width="5"/>
      <path d="M373 207L355 235M404 201L389 239" stroke="#ffd45f" stroke-width="7"/>
    </g>

    <g class="head">
      <path d="M449 253Q437 221 459 194Q487 159 545 174Q577 181 596 203L681 213Q715 217 722 239Q710 270 655 273L572 278Q513 302 465 277Z" fill="url(#scaleGreen)" stroke="#185e35" stroke-width="7" stroke-linejoin="round"/>
      <path d="M455 215Q430 199 438 176Q455 152 490 173" fill="#4b9d3e" stroke="#185e35" stroke-width="6"/>
      <path d="M461 190L446 164L475 174L479 148L501 171L517 148L529 178" fill="#76bf43" stroke="#185e35" stroke-width="5" stroke-linejoin="round"/>
      <path d="M541 183Q537 155 562 149Q587 153 583 187" fill="#86cc48" stroke="#185e35" stroke-width="6"/>
      <circle cx="562" cy="164" r="10" fill="#fff"/>
      <circle cx="565" cy="166" r="5" fill="#171d1b"/>
      <path d="M510 184Q546 169 590 186" fill="none" stroke="#27393a" stroke-width="8" stroke-linecap="round"/>
      <path d="M508 183Q529 167 550 183L543 204Q520 208 508 183Z" fill="#9de7ff" stroke="#263941" stroke-width="5" opacity=".88"/>
      <path d="M552 183Q573 166 594 187L584 207Q563 208 552 183Z" fill="#9de7ff" stroke="#263941" stroke-width="5" opacity=".88"/>
      <path d="M540 185H555" stroke="#263941" stroke-width="5"/>
      <path d="M523 177L535 198M565 177L579 199" stroke="#fff" stroke-width="4" opacity=".7"/>
      <ellipse cx="687" cy="230" rx="7" ry="5" fill="#173d2c"/>
      <ellipse cx="666" cy="226" rx="6" ry="4" fill="#173d2c"/>

      <g class="jaw">
        <path d="M569 249Q626 257 710 239Q701 279 652 291Q604 295 567 275Z" fill="#b9dd68" stroke="#185e35" stroke-width="6"/>
        <path d="M591 259L602 280L613 258L626 280L640 255L654 275L669 251L681 267" fill="#fffdf0" stroke="#185e35" stroke-width="3" stroke-linejoin="round"/>
        <path d="M613 278Q644 270 673 278" fill="none" stroke="#e97875" stroke-width="8" stroke-linecap="round"/>
      </g>

      <path d="M473 238Q484 255 500 250" fill="none" stroke="#1c6837" stroke-width="5" stroke-linecap="round"/>
      <circle cx="491" cy="220" r="4" fill="#327b37"/>
      <circle cx="513" cy="230" r="3" fill="#327b37"/>
      <circle cx="538" cy="218" r="4" fill="#327b37"/>
    </g>

    <path d="M479 288Q500 312 521 286" fill="#f6d049" stroke="#8b6613" stroke-width="5"/>
    <circle cx="500" cy="306" r="9" fill="#fff1a8" stroke="#8b6613" stroke-width="3"/>
  </g>

  <g fill="#e8eef0" opacity=".55">
    <circle cx="275" cy="438" r="4"/>
    <circle cx="243" cy="451" r="3"/>
    <circle cx="198" cy="429" r="5"/>
    <circle cx="163" cy="460" r="3"/>
  </g>
</svg>