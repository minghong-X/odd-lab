<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aee4ff"/>
      <stop offset="100%" stop-color="#e8f9ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="100%" stop-color="#ffd93b"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="120" cy="100" r="55" fill="url(#sun)">
    <animate attributeName="cy" values="100;90;100" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Drifting clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="0" cy="120" rx="45" ry="22"/>
      <ellipse cx="35" cy="110" rx="35" ry="26"/>
      <ellipse cx="70" cy="122" rx="40" ry="20"/>
      <animateTransform attributeName="transform" type="translate" from="820 0" to="-160 0" dur="18s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.75">
      <ellipse cx="0" cy="80" rx="38" ry="18"/>
      <ellipse cx="30" cy="72" rx="30" ry="22"/>
      <ellipse cx="62" cy="82" rx="34" ry="17"/>
      <animateTransform attributeName="transform" type="translate" from="1000 0" to="-140 0" dur="26s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Ground -->
  <rect y="410" width="800" height="90" fill="#8fd36b"/>
  <rect y="410" width="800" height="12" fill="#79c257"/>

  <!-- Road -->
  <rect y="422" width="800" height="40" fill="#6b7280"/>
  <g stroke="#f5f5f5" stroke-width="6" stroke-dasharray="40 40">
    <line x1="0" y1="442" x2="800" y2="442">
      <animate attributeName="x1" values="0;-80" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="800;720" dur="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Whole rider bobs up and down slightly -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- ===== Bicycle ===== -->
    <g stroke="#222" stroke-width="6" fill="none" stroke-linecap="round">
      <!-- Rear wheel -->
      <circle cx="300" cy="360" r="55" stroke="#333" stroke-width="7"/>
      <g stroke="#888" stroke-width="3">
        <line x1="300" y1="360" x2="300" y2="305"/>
        <line x1="300" y1="360" x2="355" y2="360"/>
        <line x1="300" y1="360" x2="300" y2="415"/>
        <line x1="300" y1="360" x2="245" y2="360"/>
        <line x1="300" y1="360" x2="339" y2="321"/>
        <line x1="300" y1="360" x2="339" y2="399"/>
        <line x1="300" y1="360" x2="261" y2="399"/>
        <line x1="300" y1="360" x2="261" y2="321"/>
        <animateTransform attributeName="transform" type="rotate" from="0 300 360" to="360 300 360" dur="0.9s" repeatCount="indefinite"/>
      </g>

      <!-- Front wheel -->
      <circle cx="500" cy="360" r="55" stroke="#333" stroke-width="7"/>
      <g stroke="#888" stroke-width="3">
        <line x1="500" y1="360" x2="500" y2="305"/>
        <line x1="500" y1="360" x2="555" y2="360"/>
        <line x1="500" y1="360" x2="500" y2="415"/>
        <line x1="500" y1="360" x2="445" y2="360"/>
        <line x1="500" y1="360" x2="539" y2="321"/>
        <line x1="500" y1="360" x2="539" y2="399"/>
        <line x1="500" y1="360" x2="461" y2="399"/>
        <line x1="500" y1="360" x2="461" y2="321"/>
        <animateTransform attributeName="transform" type="rotate" from="0 500 360" to="360 500 360" dur="0.9s" repeatCount="indefinite"/>
      </g>

      <!-- Frame -->
      <line x1="300" y1="360" x2="400" y2="360" stroke="#e63946"/>
      <line x1="400" y1="360" x2="340" y2="290" stroke="#e63946"/>
      <line x1="300" y1="360" x2="340" y2="290" stroke="#e63946"/>
      <line x1="400" y1="360" x2="500" y2="360" stroke="#e63946"/>
      <line x1="340" y1="290" x2="500" y2="360" stroke="#e63946"/>
      <!-- Seat post -->
      <line x1="340" y1="290" x2="330" y2="255" stroke="#e63946"/>
      <!-- Head tube / handlebars -->
      <line x1="500" y1="360" x2="520" y2="270" stroke="#e63946"/>
      <line x1="520" y1="270" x2="555" y2="260" stroke="#222"/>
    </g>

    <!-- Seat -->
    <rect x="308" y="245" width="45" height="12" rx="6" fill="#222"/>

    <!-- Pedals / crank (rotating) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 400 360" to="360 400 360" dur="0.9s" repeatCount="indefinite"/>
      <line x1="400" y1="360" x2="400" y2="392" stroke="#222" stroke-width="5"/>
      <rect x="386" y="390" width="28" height="9" rx="3" fill="#111"/>
      <line x1="400" y1="360" x2="400" y2="328" stroke="#222" stroke-width="5"/>
      <rect x="386" y="323" width="28" height="9" rx="3" fill="#111"/>
    </g>

    <!-- ===== Pelican ===== -->
    <g>
      <!-- legs to pedals -->
      <line x1="360" y1="240" x2="400" y2="360" stroke="#f4a63b" stroke-width="8" stroke-linecap="round"/>
      <line x1="360" y1="240" x2="405" y2="330" stroke="#f2933a" stroke-width="8" stroke-linecap="round"/>

      <!-- Tail -->
      <path d="M300 210 Q265 205 250 225 Q285 225 305 235 Z" fill="#f2f2f2"/>

      <!-- Body -->
      <ellipse cx="355" cy="215" rx="70" ry="52" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
      <!-- Wing (flaps a touch) -->
      <path d="M355 200 Q400 185 430 220 Q395 235 355 225 Z" fill="#ececec">
        <animateTransform attributeName="transform" type="rotate" values="0 360 210;-6 360 210;0 360 210" dur="0.6s" repeatCount="indefinite"/>
      </path>

      <!-- Neck & head -->
      <path d="M400 200 Q440 160 445 120 Q448 100 435 95 Q412 108 415 150 Q400 175 385 190 Z" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
      <circle cx="440" cy="105" r="26" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>

      <!-- Eye -->
      <circle cx="450" cy="98" r="5" fill="#222"/>
      <circle cx="452" cy="96" r="1.6" fill="#fff"/>

      <!-- Upper beak -->
      <path d="M462 100 L520 108 L462 118 Z" fill="#ffb02e"/>
      <!-- Lower beak / pouch -->
      <path d="M462 116 Q495 150 518 110 Q495 128 462 118 Z" fill="#ffd166" stroke="#f4a63b" stroke-width="1.5"/>

      <!-- Little scarf flapping in the wind -->
      <path d="M405 150 Q380 160 360 155 L365 175 Q385 172 405 168 Z" fill="#e63946">
        <animate attributeName="d"
          values="M405 150 Q380 160 360 155 L365 175 Q385 172 405 168 Z;
                  M405 150 Q378 152 356 145 L362 168 Q384 168 405 168 Z;
                  M405 150 Q380 160 360 155 L365 175 Q385 172 405 168 Z"
          dur="0.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>